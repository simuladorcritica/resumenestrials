<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta · Resumenes Trials</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--tinta:#12233b;--tinta-2:#38506e;--teal:#1c8a8a;--teal-hondo:#0f5f5f;--papel:#f7f6f2;--papel-2:#efece4;--linea:#ddd8cc;--err:#a3311f;--ok:#0f5f5f}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--papel);color:var(--tinta);font-family:'Newsreader',Georgia,serif;font-size:18px;line-height:1.55}.wrap{max-width:720px;margin:0 auto;padding:42px 24px 80px}.volver{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-hondo);text-decoration:none}.eyebrow{margin-top:42px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal-hondo)}h1{font-family:'Fraunces',serif;font-size:clamp(36px,7vw,58px);font-weight:600;line-height:1.03;margin:8px 0 12px}.sub{color:var(--tinta-2);margin-bottom:28px}.panel{border-top:1px solid var(--linea);padding-top:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:640px){.grid{grid-template-columns:1fr}}.campo{margin-bottom:17px}label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-2);margin-bottom:6px}input[type=text],input[type=email],input[type=password]{width:100%;font:inherit;color:var(--tinta);background:#fff;border:1px solid var(--linea);border-radius:4px;padding:11px 12px}input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(28,138,138,.12)}.check{display:flex;gap:10px;align-items:flex-start;margin:18px 0;color:var(--tinta-2);font-size:15px}.check input{margin-top:5px}.check label{font-family:inherit;font-size:15px;letter-spacing:0;text-transform:none;margin:0}.check a{color:var(--teal-hondo)}button{width:100%;border:1px solid var(--teal-hondo);border-radius:4px;background:var(--teal-hondo);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.04em;padding:13px 18px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.estado{min-height:22px;margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:12px}.estado.err{color:var(--err)}.estado.ok{color:var(--ok)}.login{text-align:center;margin-top:24px;color:var(--tinta-2);font-size:15px}.login a{color:var(--teal-hondo)}
</style>
</head>
<body>
<main class="wrap">
  <a class="volver" href="index.html">← Volver al sitio</a>
  <div class="eyebrow">Cuenta personal</div>
  <h1>Crear cuenta</h1>
  <p class="sub">Regístrate para recibir novedades y, más adelante, guardar tus preferencias y resúmenes favoritos.</p>

  <form id="registro" class="panel" novalidate>
    <div class="grid">
      <div class="campo"><label for="nombre">Nombre</label><input id="nombre" name="nombre" type="text" autocomplete="given-name" required maxlength="80"></div>
      <div class="campo"><label for="apellido">Apellido</label><input id="apellido" name="apellido" type="text" autocomplete="family-name" required maxlength="100"></div>
    </div>
    <div class="campo"><label for="usuario">Nombre de usuario</label><input id="usuario" name="usuario" type="text" autocomplete="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9._-]+"></div>
    <div class="campo"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" required></div>
    <div class="grid">
      <div class="campo"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8"></div>
      <div class="campo"><label for="password2">Confirmar contraseña</label><input id="password2" name="password2" type="password" autocomplete="new-password" required minlength="8"></div>
    </div>

    <div class="check"><input id="novedades" type="checkbox" checked><label for="novedades">Quiero recibir avisos por correo cuando se publiquen nuevos resúmenes.</label></div>
    <div class="check"><input id="privacidad" type="checkbox" required><label for="privacidad">He leído y acepto el <a href="privacidad.html" target="_blank" rel="noopener">Aviso de privacidad</a>.</label></div>

    <button id="enviar" type="submit">Crear cuenta</button>
    <div id="estado" class="estado" role="status" aria-live="polite"></div>
  </form>

  <p class="login">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
</main>

<script type="module">
import { signUpUser, validUsername } from "./auth.js";
const form=document.getElementById("registro");const estado=document.getElementById("estado");const btn=document.getElementById("enviar");
form.addEventListener("submit",async(e)=>{e.preventDefault();estado.className="estado";estado.textContent="";
  const firstName=document.getElementById("nombre").value.trim();
  const lastName=document.getElementById("apellido").value.trim();
  const username=document.getElementById("usuario").value.trim();
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const password2=document.getElementById("password2").value;
  const newsletterOptIn=document.getElementById("novedades").checked;
  if(!form.reportValidity())return;
  if(!validUsername(username)){estado.className="estado err";estado.textContent="El nombre de usuario debe tener 3–30 caracteres y usar solo letras, números, punto, guion o guion bajo.";return;}
  if(password!==password2){estado.className="estado err";estado.textContent="Las contraseñas no coinciden.";return;}
  btn.disabled=true;btn.textContent="Creando cuenta…";
  try{await signUpUser({firstName,lastName,username,email,password,newsletterOptIn});form.reset();document.getElementById("novedades").checked=true;estado.className="estado ok";estado.textContent="Cuenta creada. Revisa tu correo y confirma tu dirección antes de iniciar sesión.";}
  catch(err){console.error(err);estado.className="estado err";estado.textContent=err?.message||"No fue posible crear la cuenta.";}
  finally{btn.disabled=false;btn.textContent="Crear cuenta";}
});
</script>
</body>
</html>
