<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña · Resumenes Trials</title><meta name="robots" content="noindex,follow"><link rel="icon" type="image/png" href="favicon.png">


</head><body><div class="ev-page"><div class="ev-wrap"><div class="ev-eyebrow">Seguridad de la cuenta</div><h1 id="titulo">Recuperar contraseña</h1><p id="sub" class="ev-sub">Escribe el correo de tu cuenta y te enviaremos un enlace seguro para crear una nueva contraseña.</p>
<form id="solicitud" class="ev-panel"><div class="ev-campo"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" required></div><div id="turnstile-recuperar" class="ev-turnstile-slot" aria-label="Verificación anti-bot"></div><button id="enviar" type="submit">Enviar enlace de recuperación</button><div id="estado" class="ev-estado" role="status" aria-live="polite"></div></form>
<form id="nueva" class="ev-panel" hidden><div class="ev-campo"><label for="password">Nueva contraseña</label><input id="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="ev-campo"><label for="password2">Confirmar contraseña</label><input id="password2" type="password" autocomplete="new-password" minlength="8" required></div><button id="guardar" type="submit">Guardar nueva contraseña</button><div id="estado2" class="ev-estado" role="status" aria-live="polite"></div></form>
<p class="ev-pie">¿Recordaste tu contraseña? <a href="login.html">Iniciar sesión</a></p></div></div>
<script type="module">import{requestPasswordReset,updatePassword,supabase}from'./auth.js';import{mountTurnstile,turnstileEnabled}from'./turnstile.js';const params=new URLSearchParams(location.search),modo=params.get('modo');const solicitud=document.getElementById('solicitud'),nueva=document.getElementById('nueva'),titulo=document.getElementById('titulo'),sub=document.getElementById('sub'),estado=document.getElementById('estado');let captcha=null;if(modo==='nueva'){solicitud.hidden=true;nueva.hidden=false;titulo.textContent='Crear nueva contraseña';sub.textContent='Elige una contraseña nueva de al menos 8 caracteres.';}else{try{captcha=await mountTurnstile('turnstile-recuperar','password_reset')}catch(err){console.error(err);estado.className='ev-estado ev-err';estado.textContent='No fue posible cargar la verificación de seguridad. Recarga la página.'}}solicitud.addEventListener('submit',async(ev)=>{ev.preventDefault();const b=document.getElementById('enviar'),e=document.getElementById('estado');const captchaToken=captcha?.getToken?.()||null;if(turnstileEnabled()&&!captchaToken){e.className='ev-estado ev-err';e.textContent='Completa la verificación de seguridad antes de continuar.';return}b.disabled=true;b.textContent='Enviando…';e.textContent='';try{await requestPasswordReset(document.getElementById('email').value,captchaToken);e.className='ev-estado ev-ok';e.textContent='Si existe una cuenta con ese correo, recibirás un enlace para restablecer la contraseña.';}catch(err){console.error(err);captcha?.reset?.();e.className='ev-estado ev-err';e.textContent='No fue posible enviar el correo de recuperación. Inténtalo de nuevo en unos minutos.';}finally{b.disabled=false;b.textContent='Enviar enlace de recuperación';}});nueva.addEventListener('submit',async(ev)=>{ev.preventDefault();const p1=document.getElementById('password').value,p2=document.getElementById('password2').value,b=document.getElementById('guardar'),e=document.getElementById('estado2');if(p1!==p2){e.className='ev-estado ev-err';e.textContent='Las contraseñas no coinciden.';return;}if(p1.length<8){e.className='ev-estado ev-err';e.textContent='La contraseña debe tener al menos 8 caracteres.';return;}b.disabled=true;b.textContent='Guardando…';e.textContent='';try{if(!supabase)throw new Error('Supabase no configurado');await updatePassword(p1);location.href='login.html?password=actualizada';}catch(err){console.error(err);e.className='ev-estado ev-err';e.textContent='El enlace puede haber expirado o no ser válido. Solicita uno nuevo.';}finally{b.disabled=false;b.textContent='Guardar nueva contraseña';}});</script></body></html>
