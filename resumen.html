<style>
  :root {
    --tinta:#12233b; --tinta-2:#38506e; --teal:#1c8a8a; --teal-hondo:#0f5f5f;
    --papel:#f7f6f2; --papel-2:#efece4; --linea:#ddd8cc; --ambar:#c8892a;
    --critica:#0f5f5f; --interna:#8a4a1c;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--papel); color:var(--tinta);
    font-family:'Newsreader',Georgia,serif; font-size:19px; line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .envoltorio { max-width:1200px; margin:0 auto; padding:0 clamp(24px,5vw,64px); }

  /* ---- Masthead persistente ---- */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    background: rgba(247,246,242,.92);
    backdrop-filter: saturate(1.2) blur(8px);
    border-bottom: 1px solid var(--linea);
  }
  .topbar-in {
    max-width:1200px; margin:0 auto;
    padding:12px clamp(24px,5vw,64px);
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .marca-top { display:inline-flex; align-items:center; }
  .marca-top img { display:block; height:30px; width:auto; }
  .top-links { display:flex; align-items:center; gap:8px; }
  .top-links a {
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px; border-radius:3px;
    color:var(--teal-hondo); text-decoration:none;
    transition:background .2s ease, color .2s ease;
  }
  .top-links a:hover { background:var(--papel-2); color:var(--teal); }
  .top-links svg { width:18px; height:18px; }

  /* ---- Migas de pan ---- */
  .migas {
    margin:22px 0 0; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    font-family:'IBM Plex Mono',monospace; font-size:11.5px;
    letter-spacing:0.06em; color:var(--tinta-2);
  }
  .migas a { color:var(--teal-hondo); text-decoration:none; }
  .migas a:hover { color:var(--teal); }
  .migas .sep { opacity:.5; }
  .migas .actual { color:var(--tinta-2); }

  header.art {
    padding:14px 0 30px; margin-bottom:8px;
    border-bottom:1px solid var(--linea);
  }
  .etiquetas { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 16px; }
  .badge {
    font-family:'IBM Plex Mono',monospace; font-size:10px;
    letter-spacing:0.12em; text-transform:uppercase;
    padding:3px 9px; border-radius:2px; white-space:nowrap;
    border:1px solid; line-height:1.5;
  }
  .badge.critica { color:var(--critica); border-color:rgba(15,95,95,.32); background:rgba(15,95,95,.06); }
  .badge.interna { color:var(--interna); border-color:rgba(138,74,28,.30); background:rgba(138,74,28,.06); }
  .badge.tema { color:var(--tinta-2); border-color:var(--linea); background:transparent; text-transform:none; letter-spacing:0.02em; }
  .fuente-linea {
    font-family:'IBM Plex Mono',monospace; font-size:12px;
    letter-spacing:0.06em; color:var(--tinta-2); margin-bottom:16px;
  }
  h1 {
    font-family:'Fraunces',serif; font-weight:500;
    font-size:clamp(30px,5vw,44px); line-height:1.1;
    letter-spacing:-0.02em;
  }

  article {
    padding:20px 0 20px;
    columns:2; column-gap:clamp(36px,4vw,64px);
  }
  article h2 {
    font-family:'IBM Plex Mono',monospace;
    font-size:12px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--teal-hondo); font-weight:500;
    margin:32px 0 10px;
    break-inside:avoid; break-after:avoid-column;
  }
  article h2:first-child { margin-top:0; }
  article p { margin-bottom:16px; text-align:justify; hyphens:auto; -webkit-hyphens:auto; }
  article strong { color:var(--tinta); font-weight:600; }

  @media (max-width:900px){
    article { columns:1; }
    article p { text-align:left; hyphens:manual; }
  }

  .version-nav {
    margin-top:14px; display:flex; flex-wrap:wrap; gap:8px 18px; align-items:baseline;
    font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.06em;
  }
  .version-etiqueta { color:var(--ambar); text-transform:uppercase; letter-spacing:0.12em; font-size:11px; }
  .cambio-version { color:var(--teal-hondo); text-decoration:none; }
  .cambio-version:hover { color:var(--teal); }

  body.modo-corto .envoltorio { max-width:820px; }
  body.modo-corto .topbar-in { max-width:820px; }
  article.corto { columns:1; }
  article.corto p { text-align:justify; hyphens:auto; -webkit-hyphens:auto; }

  .enlace-original {
    margin:8px 0 40px; padding:20px 24px;
    background:var(--papel-2); border-radius:3px;
    border-left:2px solid var(--teal);
    font-size:16px;
  }
  .enlace-original a { color:var(--teal-hondo); overflow-wrap:anywhere; word-break:break-word; }

  /* ---- Artículos relacionados ---- */
  .relacionados { margin:8px 0 8px; padding-top:14px; }
  .relacionados h2 {
    font-family:'IBM Plex Mono',monospace; font-size:12px;
    letter-spacing:0.18em; text-transform:uppercase;
    color:var(--teal-hondo); font-weight:500; margin-bottom:20px;
  }
  .rel-grid { display:grid; grid-template-columns:1fr 1fr; gap:2px 40px; }
  .rel-item { border-top:1px solid var(--linea); padding:18px 0; }
  .rel-item a { text-decoration:none; color:inherit; display:block; }
  .rel-item .rel-tit {
    font-family:'Fraunces',serif; font-weight:500; font-size:20px;
    line-height:1.2; letter-spacing:-0.01em; transition:color .2s ease;
    max-width:44ch;
  }
  .rel-item a:hover .rel-tit { color:var(--teal-hondo); }
  .rel-item .rel-fuente {
    font-family:'IBM Plex Mono',monospace; font-size:11px;
    letter-spacing:0.04em; color:var(--tinta-2); margin-top:8px;
  }
  .rel-item .etiquetas { margin:0 0 10px; }
  @media (max-width:760px){ .rel-grid { grid-template-columns:1fr; } }

  .pie-nav {
    margin-top:40px; padding-top:24px; border-top:1px solid var(--linea);
    display:flex; flex-wrap:wrap; gap:12px 24px;
    align-items:baseline; justify-content:space-between;
  }
  .volver {
    display:inline-block;
    font-family:'IBM Plex Mono',monospace; font-size:12px;
    letter-spacing:0.1em; text-transform:uppercase;
    color:var(--teal-hondo); text-decoration:none;
  }
  .volver:hover { color:var(--teal); }
  .pie-nav .volver { margin:0; }

  footer.art {
    margin-top:24px; padding:32px 0 60px;
    border-top:1px solid var(--linea);
    font-family:'IBM Plex Mono',monospace; font-size:12px;
    color:var(--tinta-2);
  }
  .aviso { font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--tinta-2); padding:40px 0; }

  /* ---- Volver al índice (destacado) + contexto ---- */
  .migas { margin:22px 0 0; display:flex; flex-wrap:wrap; gap:12px 14px; align-items:center; }
  .migas a.volver-top {
    display:inline-flex; align-items:center; gap:8px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:500;
    letter-spacing:0.08em; text-transform:uppercase;
    color:#fff; background:var(--teal-hondo);
    padding:9px 17px; border-radius:999px; text-decoration:none;
    transition:background .2s ease, transform .2s ease;
  }
  .migas a.volver-top:hover { color:#fff; background:var(--teal); transform:translateX(-2px); }
  .miga-esp {
    font-family:'IBM Plex Mono',monospace; font-size:11.5px;
    letter-spacing:0.06em; color:var(--tinta-2);
  }

  /* ---- Botón Descargar PDF ---- */
  .acciones-art { margin-top:18px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  .btn-pdf {
    display:inline-flex; align-items:center; gap:8px;
    font-family:'IBM Plex Mono',monospace; font-size:12px;
    letter-spacing:0.06em; color:var(--teal-hondo);
    background:transparent; border:1px solid rgba(15,95,95,.35);
    padding:8px 15px; border-radius:999px; cursor:pointer;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .btn-pdf:hover { background:var(--teal-hondo); color:#fff; border-color:var(--teal-hondo); }
  .btn-pdf:disabled { opacity:.6; cursor:progress; }
  .pie-nav .btn-pdf { text-transform:uppercase; letter-spacing:0.1em; }

  /* ---- Proteger la copia solo de los resúmenes ---- */
  .no-copiar, .no-copiar * {
    -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }

  /* ---- Impresión (respaldo del PDF) ---- */
  @media print {
    .topbar, .top-links, .migas, .version-nav, .pie-nav, .relacionados, .acciones-art, .btn-pdf, footer.art { display:none !important; }
    body { background:#fff; color:#000; font-size:12pt; }
    article, article.corto { columns:1 !important; }
    .no-copiar, .no-copiar * { -webkit-user-select:auto !important; user-select:auto !important; }
    a { color:#000; }
  }

  @media (prefers-reduced-motion: reduce){ *{transition:none} }
  a:focus-visible{ outline:2px solid var(--teal); outline-offset:3px; }
</style>

<div id="contenido"></div>

<script>
  // -----------------------------------------------------------
  //  El contenido de cada resumen vive en un único archivo:
  //  resumenes.json  (la misma fuente que usa el índice).
  //  Para publicar uno nuevo no se toca este archivo.
  // -----------------------------------------------------------
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const cont = document.getElementById("contenido");
  const BASE_URL = "https://resumenestrials.com";

  function textoPlano(valor) {
    const div = document.createElement("div");
    div.innerHTML = String(valor || "");
    return (div.textContent || div.innerText || "").replace(/\s+/g, " ").trim();
  }
  function recortar(texto, max = 158) {
    const limpio = textoPlano(texto);
    if (limpio.length <= max) return limpio;
    const corte = limpio.slice(0, max + 1);
    const ultimoEspacio = corte.lastIndexOf(" ");
    return (ultimoEspacio > 100 ? corte.slice(0, ultimoEspacio) : limpio.slice(0, max)).trim() + "…";
  }
  const esc = (s) => String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const fmtFecha = (iso) => {
    if (!iso) return "";
    const p = String(iso).split("-");
    return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : iso;
  };
  const claseEsp = (e) => e === "Medicina Crítica" ? "critica" : "interna";

  function fijarMeta(selector, atributo, valor) {
    const el = document.querySelector(selector);
    if (el && valor) el.setAttribute(atributo, valor);
  }
  function fijarCanonical(valor) {
    if (!valor) return;
    let el = document.querySelector('link[rel="canonical"]');
    if (!el) { el = document.createElement('link'); el.setAttribute('rel','canonical'); document.head.appendChild(el); }
    el.setAttribute('href', valor);
  }

  function badgesHTML(dato) {
    const b = [];
    if (dato.especialidad_principal) b.push(`<span class="badge ${claseEsp(dato.especialidad_principal)}">${dato.especialidad_principal}</span>`);
    if (dato.especialidad_secundaria) b.push(`<span class="badge ${claseEsp(dato.especialidad_secundaria)}">${dato.especialidad_secundaria}</span>`);
    return b.length ? `<div class="etiquetas">${b.join("")}</div>` : "";
  }

  function actualizarSEO(dato, esCorto) {
    const canonical = `${BASE_URL}/resumen.html?id=${encodeURIComponent(dato.id)}`;
    const urlCompartida = esCorto ? `${canonical}&v=corto` : canonical;
    const sufijo = esCorto ? " · resumen breve" : "";
    const titulo = `${textoPlano(dato.titulo)}${sufijo} · Resumenes Trials`;
    const baseDescripcion = dato.objetivo || dato.hallazgo ||
      "Resumen crítico en español de un ensayo clínico aleatorizado.";
    const descripcion = recortar(baseDescripcion);

    document.title = titulo;
    fijarMeta('#meta-description', 'content', descripcion);
    fijarMeta('#meta-robots', 'content', 'index,follow,max-image-preview:large');
    fijarCanonical(canonical);
    fijarMeta('#og-title', 'content', titulo);
    fijarMeta('#og-description', 'content', descripcion);
    fijarMeta('#og-url', 'content', urlCompartida);
    fijarMeta('#twitter-title', 'content', titulo);
    fijarMeta('#twitter-description', 'content', descripcion);

    const temasArr = Array.isArray(dato.temas) ? dato.temas : [];
    const about = [dato.especialidad_principal, dato.especialidad_secundaria, ...temasArr]
      .filter(Boolean).map((n) => ({ "@type": "MedicalEntity", "name": n }));

    const articulo = {
      "@type": "MedicalScholarlyArticle",
      "headline": textoPlano(dato.titulo),
      "description": descripcion,
      "inLanguage": "es",
      "mainEntityOfPage": canonical,
      "url": canonical,
      "publisher": {
        "@type": "Organization",
        "name": "Resumenes Trials",
        "url": `${BASE_URL}/`,
        "logo": { "@type": "ImageObject", "url": `${BASE_URL}/logo.png` }
      }
    };
    if (dato.fecha) articulo.datePublished = dato.fecha;
    if (dato.autor) articulo.author = { "@type": "Person", "name": textoPlano(dato.autor) };
    if (dato.revista) articulo.isPartOf = { "@type": "Periodical", "name": textoPlano(dato.revista) };
    if (dato.original) articulo.isBasedOn = dato.original;
    if (dato.doi) { const d = textoPlano(dato.doi); articulo.identifier = `https://doi.org/${d}`; articulo.sameAs = `https://doi.org/${d}`; }
    if (about.length) articulo.about = about;
    if (temasArr.length) articulo.keywords = temasArr.join(", ");

    const migas = {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Índice", "item": `${BASE_URL}/` },
        { "@type": "ListItem", "position": 2, "name": dato.especialidad_principal || "Resúmenes", "item": `${BASE_URL}/` }
      ]
    };

    const jsonLd = document.getElementById("structured-data");
    if (jsonLd) jsonLd.textContent = JSON.stringify({ "@context": "https://schema.org", "@graph": [articulo, migas] });
  }

  function migasHTML(dato) {
    const esp = dato.especialidad_principal || "Resúmenes";
    return `
      <nav class="migas" aria-label="Ruta">
        <a class="volver-top" href="index.html">← Volver al índice</a>
        <span class="miga-esp">${esc(esp)}</span>
      </nav>`;
  }

  // Artículos relacionados: por especialidad y temas compartidos, más recientes primero.
  function relacionadosHTML(dato, todos) {
    const espActual = [dato.especialidad_principal, dato.especialidad_secundaria].filter(Boolean);
    const temasActual = new Set(Array.isArray(dato.temas) ? dato.temas : []);
    const puntuar = (r) => {
      const espR = [r.especialidad_principal, r.especialidad_secundaria].filter(Boolean);
      const espComun = espR.filter((e) => espActual.includes(e)).length;
      const temasComun = (Array.isArray(r.temas) ? r.temas : []).filter((t) => temasActual.has(t)).length;
      return temasComun * 2 + espComun;
    };
    const candidatos = todos
      .filter((r) => String(r.id) !== String(dato.id))
      .map((r) => ({ r, s: puntuar(r) }))
      .filter((x) => x.s > 0)
      .sort((a, b) => (b.s - a.s) || (String(b.r.fecha||"").localeCompare(String(a.r.fecha||""))))
      .slice(0, 4)
      .map((x) => x.r);

    if (!candidatos.length) return "";
    const items = candidatos.map((r) => `
      <div class="rel-item">
        <a href="resumen.html?id=${r.id}">
          ${badgesEspHTML(r)}
          <div class="rel-tit">${r.titulo}</div>
          <div class="rel-fuente">${esc(r.autor)} · ${esc(r.revista)}${r.fecha ? " · " + fmtFecha(r.fecha) : ""}</div>
        </a>
      </div>`).join("");
    return `<section class="relacionados"><h2>Evidencia relacionada</h2><div class="rel-grid">${items}</div></section>`;
  }
  function badgesEspHTML(r) {
    const b = [];
    if (r.especialidad_principal) b.push(`<span class="badge ${claseEsp(r.especialidad_principal)}">${r.especialidad_principal}</span>`);
    if (r.especialidad_secundaria) b.push(`<span class="badge ${claseEsp(r.especialidad_secundaria)}">${r.especialidad_secundaria}</span>`);
    return b.length ? `<div class="etiquetas">${b.join("")}</div>` : "";
  }

  function noEncontrado() {
    document.title = "Resumen no encontrado · Resumenes Trials";
    fijarMeta('#meta-description', 'content', 'El resumen solicitado no está disponible en Resumenes Trials.');
    fijarMeta('#meta-robots', 'content', 'noindex,follow');
    const canonicalExistente = document.querySelector('link[rel="canonical"]');
    if (canonicalExistente) canonicalExistente.remove();
    cont.innerHTML = `<div class="envoltorio"><p class="aviso">No se encontró ese resumen. <a href="index.html" style="color:var(--teal-hondo)">Volver al índice</a> para ver los disponibles.</p></div>`;
  }

  // ---- Descarga en PDF (limpio, sobre fondo blanco) ----
  function nombreArchivoPDF(dato, esCorto) {
    const base = (textoPlano(dato.titulo).split(":")[0] || "resumen").trim();
    const seguro = base.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\-]+/g, "_").slice(0, 40) || "resumen";
    return `Resumen_${seguro}${esCorto ? "_breve" : ""}.pdf`;
  }
  function sanPDF(s) {
    return String(s == null ? "" : s)
      .replace(/\u2212/g, "-")
      .replace(/[\u2013\u2014\u2015\u2012\u2011]/g, "-")
      .replace(/[\u2018\u2019\u201B\u2032]/g, "'")
      .replace(/[\u201C\u201D\u201F\u2033]/g, '"')
      .replace(/\u2026/g, "...")
      .replace(/[\u00A0\u2007\u2009\u200A\u202F]/g, " ")
      .replace(/\u200B/g, "")
      .replace(/\u2265/g, ">=").replace(/\u2264/g, "<=")
      .replace(/\u2260/g, "!=").replace(/[\u2248\u2245]/g, "~")
      .replace(/\u2192/g, "->").replace(/\u2190/g, "<-")
      .replace(/[\u2080-\u2089]/g, (m) => String(m.charCodeAt(0) - 0x2080));
  }
  async function cargarLogoPDF() {
    try {
      const resp = await fetch("logo.png", { cache: "force-cache" });
      if (!resp.ok) return null;
      const blob = await resp.blob();
      const bmp = await (self.createImageBitmap ? createImageBitmap(blob).catch(() => null) : Promise.resolve(null));
      if (bmp) {
        const maxW = 620, escala = Math.min(1, maxW / bmp.width);
        const w = Math.max(1, Math.round(bmp.width * escala)), h = Math.max(1, Math.round(bmp.height * escala));
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(bmp, 0, 0, w, h);
        return c.toDataURL("image/png");
      }
      return await new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => res(null); fr.readAsDataURL(blob); });
    } catch (e) { return null; }
  }
  function marcaDeAgua(doc, logo, pageW, pageH) {
    if (doc.saveGraphicsState) doc.saveGraphicsState();
    try { doc.setGState(new doc.GState({ opacity: 0.05 })); } catch (e) {}
    let puesta = false;
    if (logo && logo.data) {
      try {
        const cw = pageW * 0.60, ch = cw * (logo.h / logo.w);
        doc.addImage(logo.data, logo.fmt, (pageW - cw) / 2, (pageH - ch) / 2, cw, ch, "wm_logo", "SLOW");
        puesta = true;
      } catch (e) {}
    }
    if (!puesta) {
      doc.setFont("helvetica", "bold"); doc.setFontSize(50); doc.setTextColor(15, 95, 95);
      try { doc.text("RESÚMENES TRIALS", pageW / 2, pageH / 2, { align: "center", angle: 32 }); } catch (e) {}
    }
    try { doc.setGState(new doc.GState({ opacity: 1 })); } catch (e) {}
    if (doc.restoreGraphicsState) doc.restoreGraphicsState();
  }
  async function generarPDF(dato, esCorto) {
    const ns = window.jspdf;
    if (!ns || !ns.jsPDF) { window.print(); return; }
    const doc = new ns.jsPDF({ unit: "pt", format: "a4" });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const ML = 56, maxW = pageW - ML * 2, topOtras = 66, bottom = pageH - 62;
    const acron = (textoPlano(dato.titulo).split(":")[0] || "").trim();

    let logo = null;
    const url = await cargarLogoPDF();
    if (url) {
      try {
        const props = doc.getImageProperties(url);
        logo = { data: url, w: props.width, h: props.height, fmt: (url.indexOf("image/jpeg") >= 0 ? "JPEG" : "PNG") };
      } catch (e) { logo = null; }
    }

    let y = 58;
    marcaDeAgua(doc, logo, pageW, pageH);
    const salto = () => { doc.addPage(); marcaDeAgua(doc, logo, pageW, pageH); y = topOtras; };
    const asegura = (h) => { if (y + h > bottom) salto(); };
    const lineas = (txt, w) => doc.splitTextToSize(sanPDF(txt), w);

    // ---- Cabecera de marca (página 1) ----
    doc.setCharSpace(1.2); doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(15, 95, 95);
    doc.text("RESÚMENES TRIALS", ML, y);
    doc.setCharSpace(0); doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(120, 120, 120);
    doc.text("EVIDENCIA SIN RUIDO", pageW - ML, y, { align: "right" });
    y += 9;
    doc.setDrawColor(15, 95, 95); doc.setLineWidth(1.6); doc.line(ML, y, pageW - ML, y); y += 26;

    // ---- Título ----
    doc.setFont("times", "bold"); doc.setFontSize(18); doc.setTextColor(18, 35, 59);
    lineas(textoPlano(dato.titulo), maxW).forEach((l) => { asegura(22); doc.text(l, ML, y); y += 22; });
    y += 6;

    // ---- Especialidad y tipo de estudio ----
    const esp = [dato.especialidad_principal, dato.especialidad_secundaria].filter(Boolean).join(" · ");
    const clasif = [esp, dato.tipo_estudio].filter(Boolean).join("   ·   ");
    if (clasif) {
      doc.setFont("helvetica", "bold"); doc.setFontSize(8); doc.setTextColor(15, 95, 95);
      lineas(clasif.toUpperCase(), maxW).forEach((l) => { asegura(12); doc.text(l, ML, y); y += 12; });
      y += 3;
    }

    // ---- Metadatos ----
    const meta = [dato.autor, dato.anio ? `${dato.revista} ${dato.anio}` : dato.revista, dato.doi ? "DOI: " + dato.doi : ""]
      .filter(Boolean).join("   ·   ");
    doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(56, 80, 110);
    lineas(meta, maxW).forEach((l) => { asegura(13); doc.text(l, ML, y); y += 13; });
    y += 20;

    // ---- Cuerpo ----
    const cont = document.createElement("div");
    cont.innerHTML = esCorto ? (dato.corto || "") : (dato.cuerpo || "");
    const runsDe = (el) => {
      const runs = [];
      el.childNodes.forEach((n) => {
        if (n.nodeType === 3) runs.push({ text: n.textContent, bold: false });
        else if (n.nodeType === 1) runs.push({ text: n.textContent, bold: (n.tagName === "STRONG" || n.tagName === "B") });
      });
      return runs.length ? runs : [{ text: el.textContent || "", bold: false }];
    };
    const escribirBloque = (runs, fs, lh, justificar) => {
      doc.setFontSize(fs); doc.setTextColor(24, 30, 40);
      const words = [];
      runs.forEach((r) => r.text.split(/\s+/).forEach((p) => { if (p !== "") words.push({ t: sanPDF(p), bold: r.bold }); }));
      if (!words.length) return;
      doc.setFont("times", "normal"); const espN = doc.getTextWidth(" ");
      const anchoDe = (w) => { doc.setFont("times", w.bold ? "bold" : "normal"); return doc.getTextWidth(w.t); };
      const filas = []; let linea = []; let suma = 0;
      words.forEach((w) => {
        const ww = anchoDe(w);
        const proyecto = suma + (linea.length ? espN : 0) + ww;
        if (linea.length && proyecto > maxW) { filas.push({ ws: linea, suma: suma }); linea = [w]; suma = ww; }
        else { suma += (linea.length ? espN : 0) + ww; linea.push(w); }
      });
      if (linea.length) filas.push({ ws: linea, suma: suma });
      filas.forEach((fila, idx) => {
        asegura(lh);
        const nGaps = fila.ws.length - 1;
        const esUltima = idx === filas.length - 1;
        let gap = espN;
        if (justificar && !esUltima && nGaps > 0) {
          const sumaPalabras = fila.suma - espN * nGaps;
          gap = (maxW - sumaPalabras) / nGaps;
          if (gap < espN) gap = espN;
          if (gap > espN * 5) gap = espN;
        }
        let x = ML;
        fila.ws.forEach((w, i) => {
          doc.setFont("times", w.bold ? "bold" : "normal");
          const ultimo = i === fila.ws.length - 1;
          doc.text(ultimo ? w.t : w.t + " ", x, y);
          x += doc.getTextWidth(w.t) + (ultimo ? 0 : gap);
        });
        y += lh;
      });
    };
    Array.from(cont.childNodes).forEach((n) => {
      if (n.nodeType === 1 && n.tagName === "H2") {
        y += 9; asegura(18);
        doc.setCharSpace(0.6); doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); doc.setTextColor(15, 95, 95);
        lineas(n.textContent.toUpperCase(), maxW).forEach((l) => { asegura(13); doc.text(l, ML, y); y += 13; });
        doc.setCharSpace(0);
        y += 5;
      } else if (n.nodeType === 1 && n.tagName === "P") {
        escribirBloque(runsDe(n), 10.5, 14.8, true); y += 7;
      } else if (n.nodeType === 1 && (n.tagName === "UL" || n.tagName === "OL")) {
        n.querySelectorAll("li").forEach((li) => { escribirBloque([{ text: "•  ", bold: false }].concat(runsDe(li)), 10.5, 14.8, false); y += 3; });
        y += 5;
      } else if (n.nodeType === 3 && n.textContent.trim()) {
        escribirBloque([{ text: n.textContent, bold: false }], 10.5, 14.8, true); y += 7;
      }
    });

    if (dato.original) {
      y += 6; asegura(24);
      doc.setFont("helvetica", "bold"); doc.setFontSize(8); doc.setTextColor(15, 95, 95);
      asegura(12); doc.text("ARTÍCULO ORIGINAL", ML, y); y += 12;
      doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(56, 80, 110);
      lineas(dato.original, maxW).forEach((l) => { asegura(12); doc.text(l, ML, y); y += 12; });
    }
    y += 12; asegura(26);
    doc.setDrawColor(214, 210, 200); doc.setLineWidth(0.5); doc.line(ML, y, pageW - ML, y); y += 12;
    doc.setFont("times", "italic"); doc.setFontSize(8.5); doc.setTextColor(120, 120, 120);
    lineas("Resumen crítico para profesionales de la salud. Es una guía de lectura; no reemplaza el artículo original ni el juicio clínico.", maxW)
      .forEach((l) => { asegura(11); doc.text(l, ML, y); y += 11; });

    // ---- Encabezado corrido (págs. 2+) y pie con paginación ----
    const total = doc.getNumberOfPages();
    for (let p = 1; p <= total; p++) {
      doc.setPage(p);
      if (p > 1) {
        doc.setCharSpace(0.6); doc.setFont("helvetica", "bold"); doc.setFontSize(7.5); doc.setTextColor(120, 120, 120);
        doc.text("RESÚMENES TRIALS", ML, 40); doc.setCharSpace(0);
        doc.setFont("helvetica", "normal");
        if (acron) doc.text(acron, pageW - ML, 40, { align: "right" });
        doc.setDrawColor(224, 221, 213); doc.setLineWidth(0.5); doc.line(ML, 46, pageW - ML, 46);
      }
      doc.setDrawColor(224, 221, 213); doc.setLineWidth(0.5); doc.line(ML, pageH - 44, pageW - ML, pageH - 44);
      doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(120, 120, 120);
      doc.text("resumenestrials.com/resumen.html?id=" + dato.id, ML, pageH - 31);
      doc.text("Página " + p + " de " + total, pageW - ML, pageH - 31, { align: "right" });
    }

    doc.save(nombreArchivoPDF(dato, esCorto));
  }
  async function descargarPDF(dato, esCorto, boton) {
    const rotulo = boton ? boton.textContent : "";
    if (boton) { boton.disabled = true; boton.textContent = "Generando…"; }
    try { await generarPDF(dato, esCorto); }
    catch (err) { console.error("PDF:", err); window.print(); }
    finally { if (boton) { boton.disabled = false; boton.textContent = rotulo; } }
  }

  // ---- Impedir copiar el texto de los resúmenes (el resto sí se puede) ----
  function dentroNoCopiar(nodo) {
    const el = nodo && nodo.nodeType === 1 ? nodo : (nodo ? nodo.parentElement : null);
    return !!(el && el.closest && el.closest(".no-copiar"));
  }
  document.addEventListener("copy", (e) => {
    const sel = document.getSelection();
    if (sel && sel.rangeCount && dentroNoCopiar(sel.getRangeAt(0).commonAncestorContainer)) e.preventDefault();
  }, true);
  document.addEventListener("cut", (e) => { if (dentroNoCopiar(e.target)) e.preventDefault(); }, true);
  document.addEventListener("contextmenu", (e) => { if (dentroNoCopiar(e.target)) e.preventDefault(); }, true);
  document.addEventListener("dragstart", (e) => { if (dentroNoCopiar(e.target)) e.preventDefault(); }, true);

  fetch("resumenes.json", { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then((data) => {
      const todos = Array.isArray(data) ? data : [];
      const dato = todos.find((x) => String(x.id) === String(id));
      if (!dato) { noEncontrado(); return; }

      const esCorto = params.get("v") === "corto" && !!dato.corto;
      const cuerpoHTML = esCorto ? dato.corto : dato.cuerpo;
      document.body.classList.toggle("modo-corto", esCorto);

      let versionNav = "";
      if (esCorto) {
        versionNav = `<span class="version-etiqueta">Lectura rápida</span>` +
          `<a class="cambio-version" href="resumen.html?id=${dato.id}">Ver versión completa →</a>`;
      } else if (dato.corto) {
        versionNav = `<a class="cambio-version" href="resumen.html?id=${dato.id}&v=corto">Ver versión breve →</a>`;
      }
      let versionNavPie = "";
      if (esCorto) {
        versionNavPie = `<a class="cambio-version" href="resumen.html?id=${dato.id}">Ver versión completa →</a>`;
      } else if (dato.corto) {
        versionNavPie = `<a class="cambio-version" href="resumen.html?id=${dato.id}&v=corto">Ver versión breve →</a>`;
      }

      actualizarSEO(dato, esCorto);

      const fuenteLinea = [dato.autor, dato.anio ? `${dato.revista} ${dato.anio}` : dato.revista, dato.doi]
        .filter(Boolean).join(" · ");

      cont.innerHTML = `
        <div class="envoltorio">
          ${migasHTML(dato)}
          <header class="art">
            ${badgesHTML(dato)}
            <h1>${dato.titulo}</h1>
            <div class="fuente-linea" style="margin-top:16px">${esc(fuenteLinea)}</div>
            <div class="acciones-art">
              <button type="button" class="btn-pdf" aria-label="Descargar el resumen en PDF">⬇ Descargar PDF</button>
            </div>
            ${versionNav ? `<div class="version-nav">${versionNav}</div>` : ""}
          </header>
          <article class="no-copiar ${esCorto ? "corto" : ""}">${cuerpoHTML}</article>
          ${dato.original ? `<div class="enlace-original">Artículo original: <a href="${dato.original}" target="_blank" rel="noopener">${dato.original}</a></div>` : ""}
          <div class="acciones-art" style="margin:8px 0 4px">
            <button type="button" class="btn-pdf" aria-label="Descargar el resumen en PDF">⬇ Descargar este resumen en PDF</button>
          </div>
          ${esCorto ? "" : relacionadosHTML(dato, todos)}
          <nav class="pie-nav">
            <a class="volver" href="index.html">← Volver al índice</a>
            ${versionNavPie}
          </nav>
          <footer class="art">Escribimos este resumen crítico pensando en médicos y profesionales de la salud. Léelo como una guía de lectura, nunca como un reemplazo del artículo original ni de tu propio juicio clínico.</footer>
        </div>
      `;

      document.querySelectorAll(".btn-pdf").forEach((b) =>
        b.addEventListener("click", () => descargarPDF(dato, esCorto, b)));
    })
    .catch((err) => {
      console.error("No se pudo cargar resumenes.json:", err);
      noEncontrado();
    });
</script>
