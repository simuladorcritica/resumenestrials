<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resumen · Síntesis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --tinta:#12233b; --tinta-2:#38506e; --teal:#1c8a8a; --teal-hondo:#0f5f5f;
    --papel:#f7f6f2; --papel-2:#efece4; --linea:#ddd8cc; --ambar:#c8892a;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--papel); color:var(--tinta);
    font-family:'Newsreader',Georgia,serif; font-size:19px; line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .envoltorio { max-width:720px; margin:0 auto; padding:0 32px; }

  .volver {
    display:inline-block; margin:36px 0 0;
    font-family:'IBM Plex Mono',monospace; font-size:12px;
    letter-spacing:0.1em; text-transform:uppercase;
    color:var(--teal-hondo); text-decoration:none;
  }
  .volver:hover { color:var(--teal); }

  header.art {
    padding:28px 0 32px; margin-bottom:8px;
    border-bottom:1px solid var(--linea);
  }
  .fuente-linea {
    font-family:'IBM Plex Mono',monospace; font-size:12px;
    letter-spacing:0.06em; color:var(--tinta-2); margin-bottom:18px;
  }
  h1 {
    font-family:'Fraunces',serif; font-weight:500;
    font-size:clamp(30px,5vw,44px); line-height:1.1;
    letter-spacing:-0.02em;
  }

  article { padding:8px 0 20px; }

  /* Los encabezados ### del resumen se estilizan así */
  article h2 {
    font-family:'IBM Plex Mono',monospace;
    font-size:12px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--teal-hondo); font-weight:500;
    margin:36px 0 10px;
  }
  article p { margin-bottom:18px; }
  article strong { color:var(--tinta); font-weight:500; }

  .enlace-original {
    margin:8px 0 40px; padding:20px 24px;
    background:var(--papel-2); border-radius:3px;
    border-left:2px solid var(--teal);
    font-size:16px;
  }
  .enlace-original a { color:var(--teal-hondo); }

  footer.art {
    margin-top:40px; padding:32px 0 60px;
    border-top:1px solid var(--linea);
    font-family:'IBM Plex Mono',monospace; font-size:12px;
    color:var(--tinta-2);
  }

  .aviso {
    font-family:'IBM Plex Mono',monospace; font-size:13px;
    color:var(--tinta-2); padding:40px 0;
  }

  @media (prefers-reduced-motion: reduce){ *{transition:none} }
  a:focus-visible{ outline:2px solid var(--teal); outline-offset:3px; }
</style>
</head>
<body>

<div class="envoltorio">
  <a class="volver" href="index.html">← Volver al índice</a>
</div>

<div id="contenido"></div>

<script>
  // -----------------------------------------------------------
  //  Contenido de cada resumen largo.
  //  Cuando conectemos la base de datos del bot, esto se llenará
  //  solo. Por ahora se edita aquí a mano, con la misma clave "id".
  // -----------------------------------------------------------
  const largos = {
    1: {
      titulo: "Finerenona en enfermedad renal crónica sin diabetes",
      fuente: "Heerspink HJL · NEJM 2026 · NCT05047263 · Financiado por Bayer",
      original: "https://www.nejm.org/doi/full/10.1056/NEJMoa2604625",
      cuerpo: `
<h2>Objetivo</h2>
<p>Averiguar si la finerenona, añadida al bloqueo del sistema renina-angiotensina, frena el deterioro renal en adultos con enfermedad renal crónica pero sin diabetes.</p>

<h2>Población e intervención</h2>
<p>Se estudiaron 1584 adultos sin diabetes con enfermedad renal crónica y albuminuria, todos ya tratados con IECA o ARA-II. Recibieron finerenona oral, 10 o 20 mg al día según la función renal, o placebo. El desenlace principal fue la pendiente del filtrado glomerular a 32 meses.</p>

<h2>Diseño</h2>
<p>Ensayo aleatorizado, doble ciego, controlado con placebo, analizado por intención de tratar. Financiado por Bayer, fabricante del fármaco.</p>

<h2>Resultados</h2>
<p>El filtrado cayó algo más despacio con finerenona: <strong>−3.3 frente a −4.0 ml/min/1.73 m² al año</strong>, diferencia de 0.7 (IC 95%, 0.3 a 1.1; p&lt;0.001). El compuesto renal-cardiovascular ocurrió en 13.9% frente a 16.9%, con un cociente de riesgos de 0.77 (IC 95%, 0.60 a 0.99), alrededor de un evento evitado por cada 33 pacientes tratados. El compuesto solo renal no alcanzó significancia.</p>

<h2>Seguridad</h2>
<p>La hiperpotasemia fue más frecuente con finerenona, 17% frente a 13.3%, pero casi siempre leve: la grave se mantuvo por debajo del 1% y no hubo muertes por esta causa.</p>

<h2>Conclusión</h2>
<p>La finerenona frena la caída del filtrado, pero no demuestra alargar la vida. El precio es más potasio alto, rara vez peligroso.</p>

<h2>Aplicación clínica</h2>
<p>Es una opción para sumar protección renal sobre el IECA o ARA-II en enfermedad renal crónica no diabética, vigilando el potasio. No cambia aún la supervivencia, y el beneficio se apoya en un marcador subrogado, no en eventos clínicos duros confirmados.</p>
`
    },
  };

  // Leemos el ?id= de la URL
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const dato = largos[id];
  const cont = document.getElementById("contenido");

  if (dato) {
    document.title = dato.titulo + " · Síntesis";
    cont.innerHTML = `
      <div class="envoltorio">
        <header class="art">
          <div class="fuente-linea">${dato.fuente}</div>
          <h1>${dato.titulo}</h1>
        </header>
        <article>${dato.cuerpo}</article>
        ${dato.original ? `<div class="enlace-original">Artículo original: <a href="${dato.original}" target="_blank" rel="noopener">consultar en la revista →</a></div>` : ""}
        <footer class="art">Síntesis · Resumen crítico para uso profesional. No sustituye la lectura del artículo original ni el juicio clínico.</footer>
      </div>
    `;
  } else {
    cont.innerHTML = `<div class="envoltorio"><p class="aviso">No se encontró ese resumen. <a href="index.html" style="color:var(--teal-hondo)">Volver al índice</a> para ver los disponibles.</p></div>`;
  }
</script>

</body>
</html>
