<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const cont = document.getElementById("contenido");
  const BASE_URL = "https://resumenestrials.com";
  const MI = "Medicina Interna";

  const SUBESPECIALIDADES_MI = new Map([
    ["10.1056/NEJMoa2601005", "Cardiología"],
    ["10.1056/NEJMoa2515043", "Cardiología"],
    ["10.1056/NEJMoa2516567", "Neumología"],
    ["10.1056/NEJMoa2514428", "Cardiología"],
    ["10.1056/NEJMoa2514120", "Neurología"],
    ["10.1056/NEJMoa2512918", "Cardiología"],
    ["10.1056/NEJMoa2510703", "Hematología"],
    ["10.1056/NEJMoa2513310", "Cardiología"],
    ["10.1056/NEJMoa2517213", "Cardiología"],
    ["10.1056/NEJMoa2600283", "Cardiología"],
    ["10.1056/NEJMoa2506905", "Infectología"],
    ["10.1056/NEJMoa2502457", "Infectología"]
  ]);

  function textoPlano(valor) {
    const div = document.createElement("div");
    div.innerHTML = String(valor || "");
    return (div.textContent || div.innerText || "").replace(/\s+/g," ").trim();
  }
  function normalizar(valor) {
    return String(valor || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  }
  function claveEtiqueta(valor) {
    return normalizar(valor).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  }
  function perteneceMI(dato) {
    return dato?.especialidad_principal === MI || dato?.especialidad_secundaria === MI;
  }
  function subespecialidadMI(dato) {
    if (!perteneceMI(dato)) return "";
    const doi = String(dato.doi || "").trim();
    if (SUBESPECIALIDADES_MI.has(doi)) return SUBESPECIALIDADES_MI.get(doi);
    const temas = normalizar(Array.isArray(dato.temas) ? dato.temas.join(" ") : "");
    if (/(reumat|artritis|lupus|vasculitis|espondilo)/.test(temas)) return "Reumatología";
    if (/(covid|infeccion|bacteriem|antibiot|antimicrob|tuberculosis|vih)/.test(temas)) return "Infectología";
    if (/(ictus|trombectom|neurolog|cerebrovascular|esclerosis|epilep)/.test(temas)) return "Neurología";
    if (/(embolia pulmonar|neumolog|asma|epoc|intersticial)/.test(temas)) return "Neumología";
    if (/(anticoagul|tromboemb|hematolog|anemia|plaquet|linfom|leucem)/.test(temas)) return "Hematología";
    if (/(renal|nefro|dialisis|glomerul|albuminuria)/.test(temas)) return "Nefrología";
    if (/(diabetes|endocr|tiroid|obesidad|metabol)/.test(temas)) return "Endocrinología";
    if (/(hepat|cirrosis|gastro|intestinal|pancrea)/.test(temas)) return "Gastroenterología";
    if (/(cardiolog|fibrilacion|infarto|lipid|hipertension|cardiovascular|coronari)/.test(temas)) return "Cardiología";
    return "Medicina Interna General";
  }
  function recortar(texto,max=158) {
    const limpio=textoPlano(texto);
    if (limpio.length<=max) return limpio;
    const corte=limpio.slice(0,max+1),ultimoEspacio=corte.lastIndexOf(" ");
    return (ultimoEspacio>100?corte.slice(0,ultimoEspacio):limpio.slice(0,max)).trim()+"…";
  }
  const esc=(s)=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const fmtFecha=(iso)=>{if(!iso)return"";const p=String(iso).split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:iso;};
  const claseEsp=(e)=>e==="Medicina Crítica"?"critica":"interna";

  function fijarMeta(selector,atributo,valor){const el=document.querySelector(selector);if(el&&valor)el.setAttribute(atributo,valor);}
  function fijarCanonical(valor){if(!valor)return;let el=document.querySelector('link[rel="canonical"]');if(!el){el=document.createElement('link');el.setAttribute('rel','canonical');document.head.appendChild(el);}el.setAttribute('href',valor);}

  function badgesHTML(dato) {
    const b=[];
    const especialidades=[dato.especialidad_principal,dato.especialidad_secundaria].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);
    especialidades.forEach((esp)=>b.push(`<span class="badge ${claseEsp(esp)}">${esc(esp)}</span>`));
    const sub=subespecialidadMI(dato);
    if(sub)b.push(`<span class="badge subesp-mi" data-subspecialty="${claveEtiqueta(sub)}">${esc(sub)}</span>`);
    return b.length?`<div class="etiquetas">${b.join("")}</div>`:"";
  }

  function actualizarSEO(dato,esCorto) {
    const canonical=`${BASE_URL}/resumen.html?id=${encodeURIComponent(dato.id)}`;
    const urlCompartida=esCorto?`${canonical}&v=corto`:canonical;
    const sufijo=esCorto?" · resumen breve":"";
    const titulo=`${textoPlano(dato.titulo)}${sufijo} · Resumenes Trials`;
    const descripcion=recortar(dato.objetivo||dato.hallazgo||"Resumen crítico en español de un ensayo clínico aleatorizado.");
    document.title=titulo;
    fijarMeta('#meta-description','content',descripcion);fijarMeta('#meta-robots','content','index,follow,max-image-preview:large');
    fijarCanonical(canonical);fijarMeta('#og-title','content',titulo);fijarMeta('#og-description','content',descripcion);fijarMeta('#og-url','content',urlCompartida);fijarMeta('#twitter-title','content',titulo);fijarMeta('#twitter-description','content',descripcion);
    const temasArr=Array.isArray(dato.temas)?dato.temas:[];
    const sub=subespecialidadMI(dato);
    const about=[dato.especialidad_principal,dato.especialidad_secundaria,sub,...temasArr].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).map((n)=>({"@type":"MedicalEntity","name":n}));
    const articulo={"@type":"MedicalScholarlyArticle","headline":textoPlano(dato.titulo),"description":descripcion,"inLanguage":"es","mainEntityOfPage":canonical,"url":canonical,"publisher":{"@type":"Organization","name":"Resumenes Trials","url":`${BASE_URL}/`,"logo":{"@type":"ImageObject","url":`${BASE_URL}/logo.png`}}};
    if(dato.fecha)articulo.datePublished=dato.fecha;if(dato.autor)articulo.author={"@type":"Person","name":textoPlano(dato.autor)};if(dato.revista)articulo.isPartOf={"@type":"Periodical","name":textoPlano(dato.revista)};if(dato.original)articulo.isBasedOn=dato.original;if(dato.doi){const d=textoPlano(dato.doi);articulo.identifier=`https://doi.org/${d}`;articulo.sameAs=`https://doi.org/${d}`;}if(about.length)articulo.about=about;if(temasArr.length)articulo.keywords=temasArr.join(", ");
    const migas={"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Índice","item":`${BASE_URL}/`},{"@type":"ListItem","position":2,"name":dato.especialidad_principal||"Resúmenes","item":`${BASE_URL}/`}]};
    const jsonLd=document.getElementById("structured-data");if(jsonLd)jsonLd.textContent=JSON.stringify({"@context":"https://schema.org","@graph":[articulo,migas]});
  }

  function migasHTML(){return `<nav class="migas" aria-label="Ruta"><a class="volver-top" href="index.html">← Volver al índice</a></nav>`;}

  function iconoDescarga(){
    return `<svg class="download-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11"></path><path d="m7.5 10 4.5 4.5 4.5-4.5"></path><path d="M5 20h14"></path></svg>`;
  }
  function botonesDescargaHTML(dato) {
    const full=`<button type="button" class="btn-pdf" data-pdf-version="completo" aria-label="Descargar resumen completo PDF">${iconoDescarga()}<span>Descargar resumen completo PDF</span></button>`;
    const breve=dato.corto?`<button type="button" class="btn-pdf breve" data-pdf-version="breve" aria-label="Descargar resumen breve PDF">${iconoDescarga()}<span>Descargar resumen breve PDF</span></button>`:"";
    return full+breve;
  }

  function relacionadosHTML(dato,todos) {
    const espActual=[dato.especialidad_principal,dato.especialidad_secundaria].filter(Boolean),temasActual=new Set(Array.isArray(dato.temas)?dato.temas:[]);
    const puntuar=(r)=>{const espR=[r.especialidad_principal,r.especialidad_secundaria].filter(Boolean);const espComun=espR.filter((e)=>espActual.includes(e)).length;const temasComun=(Array.isArray(r.temas)?r.temas:[]).filter((t)=>temasActual.has(t)).length;return temasComun*2+espComun;};
    const candidatos=todos.filter((r)=>String(r.id)!==String(dato.id)).map((r)=>({r,s:puntuar(r)})).filter((x)=>x.s>0).sort((a,b)=>(b.s-a.s)||(String(b.r.fecha||"").localeCompare(String(a.r.fecha||"")))).slice(0,4).map((x)=>x.r);
    if(!candidatos.length)return"";
    const items=candidatos.map((r)=>`<div class="rel-item"><a href="resumen.html?id=${r.id}">${badgesHTML(r)}<div class="rel-tit">${r.titulo}</div><div class="rel-fuente">${esc(r.autor)} · ${esc(r.revista)}${r.fecha?" · "+fmtFecha(r.fecha):""}</div></a></div>`).join("");
    return `<section class="relacionados"><h2>Evidencia relacionada</h2><div class="rel-grid">${items}</div></section>`;
  }

  function noEncontrado(){document.title="Resumen no encontrado · Resumenes Trials";fijarMeta('#meta-description','content','El resumen solicitado no está disponible en Resumenes Trials.');fijarMeta('#meta-robots','content','noindex,follow');const c=document.querySelector('link[rel="canonical"]');if(c)c.remove();cont.innerHTML=`<div class="envoltorio"><p class="aviso">No se encontró ese resumen. <a href="index.html" style="color:var(--teal-hondo)">Volver al índice</a> para ver los disponibles.</p></div>`;}

  function nombreArchivoPDF(dato,esCorto){const base=(textoPlano(dato.titulo).split(":")[0]||"resumen").trim();const seguro=base.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w\-]+/g,"_").slice(0,40)||"resumen";return `Resumen_${seguro}${esCorto?"_breve":""}.pdf`;}
  function sanPDF(s){return String(s==null?"":s).replace(/\u2212/g,"-").replace(/[\u2013\u2014\u2015\u2012\u2011]/g,"-").replace(/[\u2018\u2019\u201B\u2032]/g,"'").replace(/[\u201C\u201D\u201F\u2033]/g,'"').replace(/\u2026/g,"...").replace(/[\u00A0\u2007\u2009\u200A\u202F]/g," ").replace(/\u200B/g,"").replace(/\u2265/g,">=").replace(/\u2264/g,"<=").replace(/\u2260/g,"!=").replace(/[\u2248\u2245]/g,"~").replace(/\u2192/g,"->").replace(/\u2190/g,"<-").replace(/[\u2080-\u2089]/g,(m)=>String(m.charCodeAt(0)-0x2080));}
  async function cargarLogoPDF(){try{const resp=await fetch("logo.png",{cache:"force-cache"});if(!resp.ok)return null;const blob=await resp.blob();const bmp=await(self.createImageBitmap?createImageBitmap(blob).catch(()=>null):Promise.resolve(null));if(bmp){const maxW=620,escala=Math.min(1,maxW/bmp.width);const w=Math.max(1,Math.round(bmp.width*escala)),h=Math.max(1,Math.round(bmp.height*escala));const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(bmp,0,0,w,h);return c.toDataURL("image/png");}return await new Promise((res)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>res(null);fr.readAsDataURL(blob);});}catch(e){return null;}}
  function marcaDeAgua(doc,logo,pageW,pageH){if(doc.saveGraphicsState)doc.saveGraphicsState();try{doc.setGState(new doc.GState({opacity:.05}));}catch(e){}let puesta=false;if(logo&&logo.data){try{const cw=pageW*.60,ch=cw*(logo.h/logo.w);doc.addImage(logo.data,logo.fmt,(pageW-cw)/2,(pageH-ch)/2,cw,ch,"wm_logo","SLOW");puesta=true;}catch(e){}}if(!puesta){doc.setFont("helvetica","bold");doc.setFontSize(50);doc.setTextColor(15,95,95);try{doc.text("RESÚMENES TRIALS",pageW/2,pageH/2,{align:"center",angle:32});}catch(e){}}try{doc.setGState(new doc.GState({opacity:1}));}catch(e){}if(doc.restoreGraphicsState)doc.restoreGraphicsState();}

  async function generarPDF(dato,esCorto) {
    const ns=window.jspdf;if(!ns||!ns.jsPDF){window.print();return;}
    const doc=new ns.jsPDF({unit:"pt",format:"a4"}),pageW=doc.internal.pageSize.getWidth(),pageH=doc.internal.pageSize.getHeight();
    const ML=56,maxW=pageW-ML*2,topOtras=66,bottom=pageH-62,acron=(textoPlano(dato.titulo).split(":")[0]||"").trim();
    let logo=null;const url=await cargarLogoPDF();if(url){try{const props=doc.getImageProperties(url);logo={data:url,w:props.width,h:props.height,fmt:url.indexOf("image/jpeg")>=0?"JPEG":"PNG"};}catch(e){logo=null;}}
    let y=58;marcaDeAgua(doc,logo,pageW,pageH);const salto=()=>{doc.addPage();marcaDeAgua(doc,logo,pageW,pageH);y=topOtras;};const asegura=(h)=>{if(y+h>bottom)salto();};const lineas=(txt,w)=>doc.splitTextToSize(sanPDF(txt),w);
    doc.setCharSpace(1.2);doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.setTextColor(15,95,95);doc.text("RESÚMENES TRIALS",ML,y);doc.setCharSpace(0);doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(120,120,120);doc.text(esCorto?"VERSIÓN BREVE · EVIDENCIA SIN RUIDO":"EVIDENCIA SIN RUIDO",pageW-ML,y,{align:"right"});y+=9;doc.setDrawColor(15,95,95);doc.setLineWidth(1.6);doc.line(ML,y,pageW-ML,y);y+=26;
    doc.setFont("times","bold");doc.setFontSize(18);doc.setTextColor(18,35,59);lineas(textoPlano(dato.titulo),maxW).forEach((l)=>{asegura(22);doc.text(l,ML,y);y+=22;});y+=6;
    const sub=subespecialidadMI(dato);const esp=[dato.especialidad_principal,dato.especialidad_secundaria,sub].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(" · ");const clasif=[esp,dato.tipo_estudio].filter(Boolean).join("   ·   ");if(clasif){doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(15,95,95);lineas(clasif.toUpperCase(),maxW).forEach((l)=>{asegura(12);doc.text(l,ML,y);y+=12;});y+=3;}
    const meta=[dato.autor,dato.anio?`${dato.revista} ${dato.anio}`:dato.revista,dato.doi?"DOI: "+dato.doi:""].filter(Boolean).join("   ·   ");doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(56,80,110);lineas(meta,maxW).forEach((l)=>{asegura(13);doc.text(l,ML,y);y+=13;});y+=20;
    const contenidoPDF=document.createElement("div");contenidoPDF.innerHTML=esCorto?(dato.corto||""):(dato.cuerpo||"");
    const runsDe=(el)=>{const runs=[];el.childNodes.forEach((n)=>{if(n.nodeType===3)runs.push({text:n.textContent,bold:false});else if(n.nodeType===1)runs.push({text:n.textContent,bold:n.tagName==="STRONG"||n.tagName==="B"});});return runs.length?runs:[{text:el.textContent||"",bold:false}];};
    const escribirBloque=(runs,fs,lh,justificar)=>{doc.setFontSize(fs);doc.setTextColor(24,30,40);const words=[];runs.forEach((r)=>r.text.split(/\s+/).forEach((p)=>{if(p!=="")words.push({t:sanPDF(p),bold:r.bold});}));if(!words.length)return;doc.setFont("times","normal");const espN=doc.getTextWidth(" ");const anchoDe=(w)=>{doc.setFont("times",w.bold?"bold":"normal");return doc.getTextWidth(w.t);};const filas=[];let linea=[],suma=0;words.forEach((w)=>{const ww=anchoDe(w),proyecto=suma+(linea.length?espN:0)+ww;if(linea.length&&proyecto>maxW){filas.push({ws:linea,suma});linea=[w];suma=ww;}else{suma+=(linea.length?espN:0)+ww;linea.push(w);}});if(linea.length)filas.push({ws:linea,suma});filas.forEach((fila,idx)=>{asegura(lh);const nGaps=fila.ws.length-1,esUltima=idx===filas.length-1;let gap=espN;if(justificar&&!esUltima&&nGaps>0){const sumaPalabras=fila.suma-espN*nGaps;gap=(maxW-sumaPalabras)/nGaps;if(gap<espN)gap=espN;if(gap>espN*5)gap=espN;}let x=ML;fila.ws.forEach((w,i)=>{doc.setFont("times",w.bold?"bold":"normal");const ultimo=i===fila.ws.length-1;doc.text(ultimo?w.t:w.t+" ",x,y);x+=doc.getTextWidth(w.t)+(ultimo?0:gap);});y+=lh;});};
    Array.from(contenidoPDF.childNodes).forEach((n)=>{if(n.nodeType===1&&n.tagName==="H2"){y+=9;asegura(18);doc.setCharSpace(.6);doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.setTextColor(15,95,95);lineas(n.textContent.toUpperCase(),maxW).forEach((l)=>{asegura(13);doc.text(l,ML,y);y+=13;});doc.setCharSpace(0);y+=5;}else if(n.nodeType===1&&n.tagName==="P"){escribirBloque(runsDe(n),10.5,14.8,true);y+=7;}else if(n.nodeType===1&&(n.tagName==="UL"||n.tagName==="OL")){n.querySelectorAll("li").forEach((li)=>{escribirBloque([{text:"•  ",bold:false}].concat(runsDe(li)),10.5,14.8,false);y+=3;});y+=5;}else if(n.nodeType===3&&n.textContent.trim()){escribirBloque([{text:n.textContent,bold:false}],10.5,14.8,true);y+=7;}});
    if(dato.original){y+=6;asegura(24);doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(15,95,95);asegura(12);doc.text("ARTÍCULO ORIGINAL",ML,y);y+=12;doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(56,80,110);lineas(dato.original,maxW).forEach((l)=>{asegura(12);doc.text(l,ML,y);y+=12;});}
    y+=12;asegura(26);doc.setDrawColor(214,210,200);doc.setLineWidth(.5);doc.line(ML,y,pageW-ML,y);y+=12;doc.setFont("times","italic");doc.setFontSize(8.5);doc.setTextColor(120,120,120);lineas("Resumen crítico para profesionales de la salud. Es una guía de lectura; no reemplaza el artículo original ni el juicio clínico.",maxW).forEach((l)=>{asegura(11);doc.text(l,ML,y);y+=11;});
    const total=doc.getNumberOfPages();for(let p=1;p<=total;p++){doc.setPage(p);if(p>1){doc.setCharSpace(.6);doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.setTextColor(120,120,120);doc.text("RESÚMENES TRIALS",ML,40);doc.setCharSpace(0);doc.setFont("helvetica","normal");if(acron)doc.text(acron,pageW-ML,40,{align:"right"});doc.setDrawColor(224,221,213);doc.setLineWidth(.5);doc.line(ML,46,pageW-ML,46);}doc.setDrawColor(224,221,213);doc.setLineWidth(.5);doc.line(ML,pageH-44,pageW-ML,pageH-44);doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(120,120,120);doc.text("resumenestrials.com/resumen.html?id="+dato.id,ML,pageH-31);doc.text("Página "+p+" de "+total,pageW-ML,pageH-31,{align:"right"});}
    doc.save(nombreArchivoPDF(dato,esCorto));
  }

  async function descargarPDF(dato,esCorto,boton){const original=boton?boton.innerHTML:"";if(boton){boton.disabled=true;boton.innerHTML='<span class="pdf-loading">Generando PDF…</span>';}try{await generarPDF(dato,esCorto);}catch(err){console.error("PDF:",err);window.print();}finally{if(boton){boton.disabled=false;boton.innerHTML=original;}}}

  function dentroNoCopiar(nodo){const el=nodo&&nodo.nodeType===1?nodo:(nodo?nodo.parentElement:null);return!!(el&&el.closest&&el.closest(".no-copiar"));}
  document.addEventListener("copy",(e)=>{const sel=document.getSelection();if(sel&&sel.rangeCount&&dentroNoCopiar(sel.getRangeAt(0).commonAncestorContainer))e.preventDefault();},true);
  document.addEventListener("cut",(e)=>{if(dentroNoCopiar(e.target))e.preventDefault();},true);
  document.addEventListener("contextmenu",(e)=>{if(dentroNoCopiar(e.target))e.preventDefault();},true);
  document.addEventListener("dragstart",(e)=>{if(dentroNoCopiar(e.target))e.preventDefault();},true);

  fetch("resumenes.json",{cache:"no-store"}).then((r)=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}).then((data)=>{
    const todos=Array.isArray(data)?data:[],dato=todos.find((x)=>String(x.id)===String(id));if(!dato){noEncontrado();return;}
    const esCorto=params.get("v")==="corto"&&!!dato.corto,cuerpoHTML=esCorto?dato.corto:dato.cuerpo;document.body.classList.toggle("modo-corto",esCorto);
    let versionNav="",versionNavPie="";

    actualizarSEO(dato,esCorto);
    const fuenteLinea=[dato.autor,dato.anio?`${dato.revista} ${dato.anio}`:dato.revista,dato.doi].filter(Boolean).join(" · ");

    document.querySelectorAll(".btn-pdf").forEach((b)=>b.addEventListener("click",()=>descargarPDF(dato,b.dataset.pdfVersion==="breve",b)));
