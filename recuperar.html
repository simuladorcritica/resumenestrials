<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña · Resumenes Trials</title><meta name="robots" content="noindex,follow"><link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root{--tinta:#12233b;--tinta-2:#38506e;--teal:#1c8a8a;--teal-hondo:#0f5f5f;--papel:#f7f6f2;--linea:#ddd8cc;--err:#a3311f;--ok:#0f5f5f}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--papel);color:var(--tinta);font-family:'Newsreader',Georgia,serif;font-size:18px;line-height:1.55}.wrap{max-width:620px;margin:0 auto;padding:42px 24px 80px}.volver{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-hondo);text-decoration:none}.eyebrow{margin-top:42px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal-hondo)}h1{font-family:'Fraunces',serif;font-size:clamp(36px,7vw,58px);font-weight:600;line-height:1.03;margin:8px 0 12px}.sub{color:var(--tinta-2);margin-bottom:28px}.panel{border-top:1px solid var(--linea);padding-top:28px}.campo{margin-bottom:17px}label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-2);margin-bottom:6px}input{width:100%;font:inherit;color:var(--tinta);background:#fff;border:1px solid var(--linea);border-radius:4px;padding:11px 12px}input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(28,138,138,.12)}button{width:100%;border:1px solid var(--teal-hondo);border-radius:4px;background:var(--teal-hondo);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:13px;padding:13px 18px;cursor:pointer}button:disabled{opacity:.55}.estado{min-height:22px;margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:12px}.err{color:var(--err)}.ok{color:var(--ok)}.pie{text-align:center;margin-top:24px;color:var(--tinta-2);font-size:15px}.pie a{color:var(--teal-hondo)}</style>
</head>
<body><main class="wrap"><a class="volver" href="login.html">← Volver a iniciar sesión</a><div class="eyebrow">Seguridad de la cuenta</div><h1 id="titulo">Recuperar contraseña</h1><p id="sub" class="sub">Escribe el correo de tu cuenta y te enviaremos un enlace seguro para crear una nueva contraseña.</p>
<form id="solicitud" class="panel"><div class="campo"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" required></div><button id="enviar" type="submit">Enviar enlace de recuperación</button><div id="estado" class="estado" role="status" aria-live="polite"></div></form>
<form id="nueva" class="panel" hidden><div class="campo"><label for="password">Nueva contraseña</label><input id="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="campo"><label for="password2">Confirmar contraseña</label><input id="password2" type="password" autocomplete="new-password" minlength="8" required></div><button id="guardar" type="submit">Guardar nueva contraseña</button><div id="estado2" class="estado" role="status" aria-live="polite"></div></form>
<p class="pie">¿Recordaste tu contraseña? <a href="login.html">Iniciar sesión</a></p></main>
<script type="module">import{requestPasswordReset,updatePassword,supabase}from'./auth.js';const params=new URLSearchParams(location.search),modo=params.get('modo');const solicitud=document.getElementById('solicitud'),nueva=document.getElementById('nueva'),titulo=document.getElementById('titulo'),sub=document.getElementById('sub');if(modo==='nueva'){solicitud.hidden=true;nueva.hidden=false;titulo.textContent='Crear nueva contraseña';sub.textContent='Elige una contraseña nueva de al menos 8 caracteres.';}solicitud.addEventListener('submit',async(ev)=>{ev.preventDefault();const b=document.getElementById('enviar'),e=document.getElementById('estado');b.disabled=true;b.textContent='Enviando…';e.textContent='';try{await requestPasswordReset(document.getElementById('email').value);e.className='estado ok';e.textContent='Si existe una cuenta con ese correo, recibirás un enlace para restablecer la contraseña.';}catch(err){console.error(err);e.className='estado err';e.textContent='No fue posible enviar el correo de recuperación. Inténtalo de nuevo en unos minutos.';}finally{b.disabled=false;b.textContent='Enviar enlace de recuperación';}});nueva.addEventListener('submit',async(ev)=>{ev.preventDefault();const p1=document.getElementById('password').value,p2=document.getElementById('password2').value,b=document.getElementById('guardar'),e=document.getElementById('estado2');if(p1!==p2){e.className='estado err';e.textContent='Las contraseñas no coinciden.';return;}if(p1.length<8){e.className='estado err';e.textContent='La contraseña debe tener al menos 8 caracteres.';return;}b.disabled=true;b.textContent='Guardando…';e.textContent='';try{if(!supabase)throw new Error('Supabase no configurado');await updatePassword(p1);location.href='login.html?password=actualizada';}catch(err){console.error(err);e.className='estado err';e.textContent='El enlace puede haber expirado o no ser válido. Solicita uno nuevo.';}finally{b.disabled=false;b.textContent='Guardar nueva contraseña';}});</script></body></html>
