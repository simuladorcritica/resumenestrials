<style>:root{--tinta:#12233b;--tinta-2:#38506e;--teal:#1c8a8a;--teal-hondo:#0f5f5f;--papel:#f7f6f2;--papel-2:#efece4;--linea:#ddd8cc;--err:#a3311f;--ok:#0f5f5f}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--papel);color:var(--tinta);font-family:'Newsreader',Georgia,serif;font-size:18px;line-height:1.58;-webkit-font-smoothing:antialiased}.page{max-width:1500px;margin:0 auto;padding:0 clamp(24px,6vw,96px) 80px}.top{min-height:78px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--linea)}.brand img{height:52px;width:auto;display:block}.volver{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-hondo);text-decoration:none;border-bottom:1px solid transparent}.volver:hover{border-color:var(--teal)}.wrap{max-width:660px;padding-top:56px}.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal-hondo)}h1{font-family:'Fraunces',serif;font-size:clamp(40px,6vw,58px);font-weight:500;line-height:1.03;margin:10px 0 14px;letter-spacing:-.02em}.sub{color:var(--tinta-2);margin-bottom:32px;font-size:19px}.panel{border-top:1px solid var(--linea);padding-top:28px}.campo{margin-bottom:18px}label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-2);margin-bottom:7px}input{width:100%;font:inherit;color:var(--tinta);background:#fff;border:1px solid var(--linea);border-radius:3px;padding:12px 13px}input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(28,138,138,.1)}button{width:100%;border:1px solid var(--teal-hondo);border-radius:3px;background:var(--teal-hondo);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.04em;padding:14px 18px;cursor:pointer}button:hover{background:var(--teal);border-color:var(--teal)}button:disabled{opacity:.55}.estado{min-height:22px;margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:11px}.err{color:var(--err)}.ok{color:var(--ok)}.pie{padding-top:20px;margin-top:26px;border-top:1px solid var(--linea);color:var(--tinta-2);font-size:15px}.pie a{color:var(--teal-hondo)}.turnstile-slot{margin:10px 0 18px;min-height:1px}@media(max-width:560px){.page{padding:0 18px 52px}.top{min-height:66px}.brand img{height:42px}.wrap{padding-top:40px}}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:3px}</style>

<body><main class="page"><div class="top"><a class="brand" href="index.html"><img src="logo.png" alt="Resumenes Trials"></a><a class="volver" href="login.html">Volver a iniciar sesión</a></div><div class="wrap"><div class="eyebrow">Seguridad de la cuenta</div><h1 id="titulo">Recuperar contraseña</h1><p id="sub" class="sub">Escribe el correo de tu cuenta y te enviaremos un enlace seguro para crear una nueva contraseña.</p>
<form id="solicitud" class="panel"><div class="campo"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" required></div><div id="turnstile-recuperar" class="turnstile-slot" aria-label="Verificación anti-bot"></div><button id="enviar" type="submit">Enviar enlace de recuperación</button><div id="estado" class="estado" role="status" aria-live="polite"></div></form>
<form id="nueva" class="panel" hidden><div class="campo"><label for="password">Nueva contraseña</label><input id="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="campo"><label for="password2">Confirmar contraseña</label><input id="password2" type="password" autocomplete="new-password" minlength="8" required></div><button id="guardar" type="submit">Guardar nueva contraseña</button><div id="estado2" class="estado" role="status" aria-live="polite"></div></form>
<p class="pie">¿Recordaste tu contraseña? <a href="login.html">Iniciar sesión</a></p></div></main>
<script type="module">import{requestPasswordReset,updatePassword,supabase}from'./auth.js';import{mountTurnstile,turnstileEnabled}from'./turnstile.js';const params=new URLSearchParams(location.search),modo=params.get('modo');const solicitud=document.getElementById('solicitud'),nueva=document.getElementById('nueva'),titulo=document.getElementById('titulo'),sub=document.getElementById('sub'),estado=document.getElementById('estado');let captcha=null;if(modo==='nueva'){solicitud.hidden=true;nueva.hidden=false;titulo.textContent='Crear nueva contraseña';sub.textContent='Elige una contraseña nueva de al menos 8 caracteres.';}else{try{captcha=await mountTurnstile('turnstile-recuperar','password_reset')}catch(err){console.error(err);estado.className='estado err';estado.textContent='No fue posible cargar la verificación de seguridad. Recarga la página.'}}solicitud.addEventListener('submit',async(ev)=>{ev.preventDefault();const b=document.getElementById('enviar'),e=document.getElementById('estado');const captchaToken=captcha?.getToken?.()||null;if(turnstileEnabled()&&!captchaToken){e.className='estado err';e.textContent='Completa la verificación de seguridad antes de continuar.';return}b.disabled=true;b.textContent='Enviando…';e.textContent='';try{await requestPasswordReset(document.getElementById('email').value,captchaToken);e.className='estado ok';e.textContent='Si existe una cuenta con ese correo, recibirás un enlace para restablecer la contraseña.';}catch(err){console.error(err);captcha?.reset?.();e.className='estado err';e.textContent='No fue posible enviar el correo de recuperación. Inténtalo de nuevo en unos minutos.';}finally{b.disabled=false;b.textContent='Enviar enlace de recuperación';}});nueva.addEventListener('submit',async(ev)=>{ev.preventDefault();const p1=document.getElementById('password').value,p2=document.getElementById('password2').value,b=document.getElementById('guardar'),e=document.getElementById('estado2');if(p1!==p2){e.className='estado err';e.textContent='Las contraseñas no coinciden.';return;}if(p1.length<8){e.className='estado err';e.textContent='La contraseña debe tener al menos 8 caracteres.';return;}b.disabled=true;b.textContent='Guardando…';e.textContent='';try{if(!supabase)throw new Error('Supabase no configurado');await updatePassword(p1);location.href='login.html?password=actualizada';}catch(err){console.error(err);e.className='estado err';e.textContent='El enlace puede haber expirado o no ser válido. Solicita uno nuevo.';}finally{b.disabled=false;b.textContent='Guardar nueva contraseña';}});</script><script src="/future-experience.js?v=1" defer></script><script src="/future-experience-final.js?v=3" defer></script><script src="/future-experience-fix-v4.js?v=1" defer></script><script src="/future-experience-fix-v4-compat.js?v=1" defer></script><script src="/legacy-unifier-v4.js?v=1" defer></script></body></html>
