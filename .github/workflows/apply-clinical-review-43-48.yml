name: Apply authorized clinical review 43 48

on:
  push:
    branches:
      - clinical-review/id43-id48

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact authorized corrections
        shell: bash
        run: |
          node <<'NODE'
          import fs from 'node:fs';

          const path = 'resumenes.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const recordById = (id) => {
            const record = data.find((item) => item.id === id);
            if (!record) throw new Error(`Missing article id ${id}`);
            return record;
          };

          const replacements = [
            {
              id: 43,
              field: 'cuerpo',
              old: 'El manuscrito no indica de forma explícita una fecha de publicación en línea (solo figuran las fechas de recepción, 11 de marzo de 2026, y aceptación, 4 de mayo de 2026); se emplea como referencia la fecha de generación del PDF definitivo de la revista (11 de junio de 2026), que debería verificarse frente a la fecha de publicación electrónica registrada en la fuente primaria.',
              next: 'El artículo fue publicado electrónicamente el 13 de mayo de 2026; la versión PDF definitiva consultada está fechada el 11 de junio de 2026. Se distinguen ambas fechas para no confundir la publicación electrónica con la versión documental utilizada para la lectura.'
            },
            {
              id: 43,
              field: 'cuerpo',
              old: 'Se analizaron 298 muestras plasmáticas (74 para ceftazidima, 74 para avibactam, 75 para ceftolozano y 75 para tazobactam) y 58 muestras de ELF (14 para ceftazidima, 14 para avibactam, 15 para ceftolozano y 15 para tazobactam).',
              next: 'Se realizaron 298 determinaciones plasmáticas (74 para ceftazidima, 74 para avibactam, 75 para ceftolozano y 75 para tazobactam) y 58 determinaciones de ELF (14 para ceftazidima, 14 para avibactam, 15 para ceftolozano y 15 para tazobactam), derivadas de 29 lavados broncoalveolares; por tanto, estas cifras representan mediciones de los distintos analitos y no el número de pacientes.'
            },
            {
              id: 48,
              field: 'cuerpo',
              old: 'Estudio aprobado por el Comité Ético del Hadassah Hebrew University Medical Center (protocolo HMO-0684-15) y registrado en ClinicalTrials.gov (NCT02802527, registrado el 13 de abril de 2016). Recibido el 17 de diciembre de 2025 y aceptado el 16 de febrero de 2026; el manuscrito no indica de forma explícita una fecha de publicación en línea, por lo que se emplea como referencia la fecha de generación del PDF definitivo de la revista (28 de abril de 2026), que debería verificarse frente a la fecha de publicación electrónica registrada en la fuente primaria.',
              next: 'Estudio aprobado por el Comité Ético del Hadassah Hebrew University Medical Center (protocolo HMO-0684-15) y registrado en ClinicalTrials.gov (NCT02802527; envío inicial del registro el 13 de abril de 2016 y primera publicación pública del registro el 16 de junio de 2016). Recibido el 17 de diciembre de 2025 y aceptado el 16 de febrero de 2026; el artículo fue publicado electrónicamente el 18 de marzo de 2026 y la versión PDF definitiva consultada está fechada el 28 de abril de 2026; se distinguen ambas fechas para no confundir la publicación electrónica con la versión documental utilizada para la lectura.'
            },
            {
              id: 48,
              field: 'cuerpo',
              old: 'el resumen del artículo emplea la cifra de 307 al describir la "aleatorización", cuando en realidad corresponde a la población analizada tras las pérdidas de seguimiento, una imprecisión terminológica menor que conviene verificar frente al diagrama de flujo CONSORT de la fuente primaria.',
              next: 'el resumen del artículo emplea la cifra de 307 al describir la "aleatorización", cuando en realidad corresponde a la población analizada tras las seis pérdidas de seguimiento; se trata de una imprecisión terminológica del resumen que no cambia los desenlaces publicados.'
            },
            {
              id: 48,
              field: 'cuerpo',
              old: 'Existe además una imprecisión terminológica entre el resumen del artículo, que describe 307 pacientes como "aleatorizados", y el diagrama de flujo CONSORT junto con el texto de resultados, que indican que en realidad se aleatorizaron 313 pacientes (156 y 157 por grupo) y que 307 es la cifra de pacientes finalmente analizados tras 6 pérdidas de seguimiento (3 por grupo); esta discrepancia terminológica requiere verificación frente a la fuente primaria, aunque no afecta la validez de los resultados reportados.',
              next: 'Existe además una imprecisión terminológica en el resumen del artículo, que describe 307 pacientes como "aleatorizados", mientras que el texto de resultados indica que se aleatorizaron 313 pacientes (156 y 157 por grupo) y que 307 fue la cifra finalmente analizada tras seis pérdidas de seguimiento (3 por grupo); la discrepancia debe atribuirse al resumen y no cambia los desenlaces publicados. La figura CONSORT no pudo inspeccionarse visualmente en esta revisión.'
            }
          ];

          for (const change of replacements) {
            const record = recordById(change.id);
            const current = record[change.field];
            const occurrences = current.split(change.old).length - 1;
            if (occurrences !== 1) {
              throw new Error(`Expected exactly one match for id ${change.id}, field ${change.field}; found ${occurrences}`);
            }
            record[change.field] = current.replace(change.old, change.next);
          }

          fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`, 'utf8');
          console.log('Applied authorized corrections to IDs 43 and 48 only.');
          console.log('Fields changed: cuerpo only.');
          NODE

      - name: Rebuild derived site files
        run: npm run build

      - name: Validate diff
        run: |
          git diff --check
          git diff --stat

      - name: Commit and push generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resumenes.json
          git add -A
          git commit -m 'clinical: clarify publication and analysis counts for IDs 43 and 48'
          git push origin HEAD:clinical-review/id43-id48
