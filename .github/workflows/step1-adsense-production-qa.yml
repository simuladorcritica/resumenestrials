name: Step 1 AdSense production QA

on:
  push:
    branches:
      - qa/step1-adsense-production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adsense-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify live AdSense policy in production
        run: node scripts/adsense-production-smoke.mjs
