name: Validar experiencia futura

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  future-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxis
        run: |
          node --check future-experience.js
          node --check global-search.js
          node --check library-filter-cleanup.js
          node --check future-experience-final.js
          node --check future-experience-fix-v4.js
          node --check future-experience-fix-v4-compat.js
          node --check future-experience-fix-v4-compat-base.js
          node --check legacy-unifier-v4.js
          node --check legacy-reader-design-v5.js
          node --check reader-endmatter-v7.js
          node --check reader-ui-v8.js
          node --check pdf-contact.js
          node --check trial-pdf.js
          node --check scripts/future-experience-smoke.mjs
          node --check scripts/library-filter-smoke.mjs
          node --check scripts/future-final-smoke.mjs
          node --check scripts/unified-reader-v4-smoke.mjs
          node --check scripts/reader-controls-v5-smoke.mjs
          node --check scripts/unified-reader-v4-production-smoke.mjs
          node --check scripts/future-visual-capture.mjs
          node --check scripts/future-production-smoke.mjs
          node --check scripts/adsense-production-smoke.mjs
          python3 -m py_compile aplicar_experiencia_futura.py
          python3 -m py_compile actualizar_agregar_editorial.py
      - name: Generar exactamente el sitio final
        run: |
          python3 -m pip install --disable-pip-version-check pillow==11.3.0
          python3 generar_seo.py
          python3 generar_seo_semantico.py
          python3 generar_seo_avanzado.py
          python3 restaurar_arquitectura.py
          python3 actualizar_agregar_editorial.py
          python3 aplicar_experiencia_futura.py
      - name: Verificar inyección global
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import aplicar_experiencia_futura as future

          expected_ads = 'google.com, pub-3132744538918477, DIRECT, f08c47fec0942fa0'
          ads_path = Path('ads.txt')
          assert ads_path.is_file(), 'Falta ads.txt en la raíz del sitio'
          assert ads_path.read_text(encoding='utf-8').strip() == expected_ads, 'ads.txt no coincide con el publisher autorizado'

          checked = 0
          for path in future.candidates():
              if not path.is_file():
                  continue
              s = path.read_text(encoding='utf-8')
              assert '/future-experience.css?v=1' in s, f'{path}: falta CSS futuro'
              assert '/future-experience-patch.css?v=1' in s, f'{path}: falta patch futuro'
              assert '/global-search.css?v=1' in s, f'{path}: falta CSS del buscador global'
              assert '/future-experience.js?v=1' in s, f'{path}: falta JS futuro'
              assert '/global-search.js?v=1' in s, f'{path}: falta JS del buscador global'
              assert '/future-experience-final.js?v=3' in s, f'{path}: falta ajuste JS final v3'
              assert '/future-experience-fix-v4.js?v=1' in s, f'{path}: falta unificación visual v4'
              assert '/future-experience-fix-v4-compat.js?v=1' in s, f'{path}: falta candado tipográfico v4'
              assert '/legacy-unifier-v4.js?v=1' in s, f'{path}: falta unificador legacy v4'
              assert '/reader-endmatter-v7.js?v=1' in s, f'{path}: falta orden final y relacionados v7'
              assert '/reader-ui-v8.js?v=1' in s, f'{path}: falta corrección funcional y visual v8'
              assert '/future-experience-final.js?v=1' not in s, f'{path}: conserva ajuste JS final obsoleto v1'
              assert '/future-experience-final.js?v=2' not in s, f'{path}: conserva ajuste JS final obsoleto v2'
              assert s.count(future.ADSENSE_URL) == 1, f'{path}: AdSense debe aparecer exactamente una vez'
              head, sep, _ = s.partition('</head>')
              assert sep and future.ADSENSE_URL in head, f'{path}: el script de AdSense no está dentro de <head>'
              assert 'crossorigin="anonymous"' in head, f'{path}: falta crossorigin de AdSense'
              checked += 1
          if checked < 50:
              raise SystemExit(f'Solo se verificaron {checked} páginas; se esperaban al menos 50')
          print(f'Assets futuros v8 + buscador global + AdSense presentes en {checked} páginas; ads.txt válido')
          PY
      - name: Instalar Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Servir sitio generado
        run: |
          python3 -m http.server 8000 >/tmp/rt-future-http.log 2>&1 &
          sleep 3
      - name: Probar experiencia completa
        env:
          RT_BASE_URL: http://127.0.0.1:8000
        run: |
          node scripts/future-experience-smoke.mjs
          node scripts/library-filter-smoke.mjs
          node scripts/future-final-smoke.mjs
          node scripts/unified-reader-v4-smoke.mjs
          node scripts/reader-controls-v5-smoke.mjs
          node scripts/adsense-production-smoke.mjs
      - name: Generar capturas de auditoría visual
        if: success()
        env:
          RT_BASE_URL: http://127.0.0.1:8000
        run: node scripts/future-visual-capture.mjs
      - name: Guardar capturas
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: future-experience-screenshots
          path: future-screenshots/*.png
          retention-days: 7

  future-production:
    if: github.event_name != 'pull_request'
    needs: future-experience
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar navegador
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Esperar despliegue y validar producción
        run: |
          node scripts/future-production-smoke.mjs
          node scripts/unified-reader-v4-production-smoke.mjs
          node scripts/adsense-production-smoke.mjs
