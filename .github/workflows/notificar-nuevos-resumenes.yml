name: Avisar nuevos resúmenes por correo

on:
  push:
    branches: [main]
    paths:
      - resumenes.json

permissions:
  contents: read
  actions: read

concurrency:
  group: newsletter-${{ github.sha }}
  cancel-in-progress: false

jobs:
  notificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invocar servicio de avisos
        env:
          ENDPOINT: https://hnsmozvatgyrascxbhys.supabase.co/functions/v1/notify-new-summaries
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          CALLBACK_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(jq -nc \
            --argjson run_id "$RUN_ID" \
            --argjson run_attempt "$RUN_ATTEMPT" \
            --arg before_sha "$BEFORE_SHA" \
            --arg head_sha "$HEAD_SHA" \
            '{run_id:$run_id,run_attempt:$run_attempt,before_sha:$before_sha,head_sha:$head_sha}')

          for intento in 1 2 3; do
            salida=$(mktemp)
            codigo=$(curl --silent --show-error \
              --output "$salida" \
              --write-out '%{http_code}' \
              --connect-timeout 10 \
              --max-time 90 \
              --request POST \
              --header 'Content-Type: application/json' \
              --header "X-GitHub-Token: $CALLBACK_GITHUB_TOKEN" \
              --data "$payload" \
              "$ENDPOINT" || true)

            echo "Respuesta HTTP: $codigo"
            cat "$salida"
            echo

            if [[ "$codigo" =~ ^2 ]]; then
              exit 0
            fi

            if [ "$intento" -lt 3 ]; then
              sleep $((intento * 5))
            fi
          done

          echo "No fue posible completar el envío de avisos después de 3 intentos." >&2
          exit 1
