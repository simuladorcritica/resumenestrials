name: Avisar nuevos resúmenes por correo

# Un solo correo al día, a las 12:30 (hora del centro de México = 18:30 UTC), con todos los resúmenes
# nuevos desde el último aviso. Decisión del editor (2026-11-12): los resúmenes se publican de madrugada
# y el aviso sale a mediodía. El rango va del commit de main del último aviso exitoso al main de esta
# corrida, así no se repite ni se pierde ningún resumen aunque una corrida falle o se retrase.
on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: newsletter-diario
  cancel-in-progress: false

jobs:
  notificar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Invocar servicio de avisos
        env:
          ENDPOINT: https://hnsmozvatgyrascxbhys.supabase.co/functions/v1/notify-new-summaries
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          CALLBACK_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Commit de main del último aviso exitoso (programado, manual o, antes del 2026-11-13, por push).
          BEFORE_SHA=$(gh api "repos/$REPO/actions/workflows/notificar-nuevos-resumenes.yml/runs?status=success&branch=main&per_page=30" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID)][0].head_sha // empty")
          if [ -z "$BEFORE_SHA" ]; then
            echo "No encontré el aviso anterior; no envío nada para no repetir correos." >&2
            exit 1
          fi
          if [ "$BEFORE_SHA" = "$HEAD_SHA" ]; then
            echo "main no cambió desde el último aviso: no hay nada que enviar."
            exit 0
          fi
          echo "Rango del aviso: $BEFORE_SHA...$HEAD_SHA"

          payload=$(jq -nc \
            --argjson run_id "$RUN_ID" \
            --argjson run_attempt "$RUN_ATTEMPT" \
            --arg before_sha "$BEFORE_SHA" \
            --arg head_sha "$HEAD_SHA" \
            '{run_id:$run_id,run_attempt:$run_attempt,before_sha:$before_sha,head_sha:$head_sha}')

          for intento in 1 2 3; do
            salida=$(mktemp)
            codigo=$(curl --silent --show-error \
              --output "$salida" \
              --write-out '%{http_code}' \
              --connect-timeout 10 \
              --max-time 90 \
              --request POST \
              --header 'Content-Type: application/json' \
              --header "X-GitHub-Token: $CALLBACK_GITHUB_TOKEN" \
              --data "$payload" \
              "$ENDPOINT" || true)

            echo "Respuesta HTTP: $codigo"
            cat "$salida"
            echo

            if [[ "$codigo" =~ ^2 ]]; then
              exit 0
            fi

            if [ "$intento" -lt 3 ]; then
              sleep $((intento * 5))
            fi
          done

          echo "No fue posible completar el envío de avisos después de 3 intentos." >&2
          exit 1
