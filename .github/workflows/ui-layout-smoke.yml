name: Validar interfaz principal

on:
  pull_request:
    branches: [main]
    paths:
      - 'ui/**'
      - 'site_templates.py'
      - 'templates/**'
      - 'scripts/design-browser-suites.mjs'
      - ui/archive.js
      - ui/archive.js
      - _includes/index-source.html
      - scripts/home-controls-smoke.mjs
      - .github/workflows/ui-layout-smoke.yml
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'site_templates.py'
      - 'templates/**'
      - 'scripts/design-browser-suites.mjs'
      - ui/archive.js
      - ui/archive.js
      - _includes/index-source.html
      - scripts/home-controls-smoke.mjs
      - .github/workflows/ui-layout-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-layout-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  controls:
    runs-on: ubuntu-latest
    # Contenedor oficial de Playwright (misma versión que package.json): navegadores y
    # dependencias ya instalados. Instalarlos con apt llegó a tardar 14 min y agotaba el tiempo.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'
      - name: Instalar paquete de Playwright
        run: npm install
      - name: Servir sitio local
        run: |
          python3 -m http.server 8000 >/tmp/rt-ui-http.log 2>&1 &
          sleep 3
      - name: Validar filtro de revistas y fila completa
        env:
          RT_BASE_URL: http://127.0.0.1:8000
        run: node scripts/home-controls-smoke.mjs
