name: Voz · muestras

# Genera unas pocas muestras de voz (Google Cloud Text-to-Speech) para que el editor elija de oído la voz de los
# resúmenes completos. Lee el plan de tools/voz_muestras.json, sintetiza el mismo fragmento con cada voz y deja los
# MP3 en la rama `voz-muestras` (rama suelta, sin historia, que se sobrescribe en cada ejecución; no se publica).
# Necesita el secreto GOOGLE_TTS_API_KEY (clave de API de Google Cloud limitada a «Cloud Text-to-Speech API»).
# No toca `main`, no cambia ningún resumen y gasta unos pocos miles de caracteres (dentro de la parte gratuita).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/voz_muestras.json

permissions:
  contents: write

concurrency:
  group: voz-muestras
  cancel-in-progress: false

jobs:
  muestras:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Comprobar la clave
        id: clave
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: |
          if [ -z "${GOOGLE_TTS_API_KEY:-}" ]; then
            echo "::warning::Falta el secreto GOOGLE_TTS_API_KEY: no se genera ninguna muestra. Añádelo en Settings → Secrets and variables → Actions y pulsa «Run workflow»."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar el repositorio
        if: steps.clave.outputs.ok == 'true'
        uses: actions/checkout@v7.0.1

      - name: Preparar Python
        if: steps.clave.outputs.ok == 'true'
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Comprobar el texto para leer
        if: steps.clave.outputs.ok == 'true'
        run: python tools/test_voz.py

      - name: Generar las muestras
        if: steps.clave.outputs.ok == 'true'
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: python tools/voz.py muestras --salida "$RUNNER_TEMP/muestras"

      - name: Dejar las muestras en la rama voz-muestras
        if: steps.clave.outputs.ok == 'true'
        run: |
          cd "$RUNNER_TEMP/muestras"
          git init -q -b voz-muestras
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Muestras de voz ($(date -u +%Y-%m-%dT%H:%MZ), $GITHUB_SHA)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voz-muestras
          echo "Muestras en la rama voz-muestras: $(ls *.mp3 | wc -l) archivos."
