name: Regenerar experiencia futura

on:
  pull_request:
    branches: [main]
    paths:
      - "aplicar_experiencia_futura.py"
      - "future-experience.css"
      - "future-experience-patch.css"
      - "future-experience.js"
      - "global-search.css"
      - "global-search.js"
      - "future-experience-final.js"
      - "future-experience-fix-v4.js"
      - "future-experience-fix-v4-compat.js"
      - "legacy-unifier-v4.js"
      - "scripts/build-site-runtime.mjs"
      - ".github/workflows/future-regenerate.yml"
  push:
    branches: [main]
    paths:
      - "aplicar_experiencia_futura.py"
      - "future-experience.css"
      - "future-experience-patch.css"
      - "future-experience.js"
      - "global-search.css"
      - "global-search.js"
      - "future-experience-final.js"
      - "future-experience-fix-v4.js"
      - "future-experience-fix-v4-compat.js"
      - "legacy-unifier-v4.js"
      - "scripts/build-site-runtime.mjs"
      - ".github/workflows/future-regenerate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-sitio-derivado-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  regenerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar rama del PR
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Descargar main
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Validar generadores e inyector
        run: |
          python -m py_compile generar_seo.py generar_seo_clusters.py generar_seo_semantico.py generar_seo_avanzado.py restaurar_arquitectura.py actualizar_agregar_editorial.py aplicar_experiencia_futura.py generar_paginas_sociales.py
          node --check future-experience.js
          node --check global-search.js
          node --check future-experience-final.js
          node --check future-experience-fix-v4.js
          node --check future-experience-fix-v4-compat.js
          node --check legacy-unifier-v4.js
          node --check pdf-contact.js
          node --check trial-pdf.js
          node --check scripts/adsense-production-smoke.mjs
          node scripts/build-site-runtime.mjs
          node --check site-runtime.js

      - name: Regenerar sitio completo
        run: |
          python generar_seo.py
          python generar_seo_semantico.py
          python generar_seo_avanzado.py
          python restaurar_arquitectura.py
          python actualizar_agregar_editorial.py
          python generar_paginas_sociales.py
          python aplicar_experiencia_futura.py

      - name: Verificar experiencia v4 y AdSense en todas las salidas
        run: |
          python - <<'PY'
          from pathlib import Path
          import aplicar_experiencia_futura as future

          expected_ads = 'google.com, pub-3132744538918477, DIRECT, f08c47fec0942fa0'
          ads_path = Path('ads.txt')
          assert ads_path.is_file(), 'Falta ads.txt en la raíz del sitio'
          assert ads_path.read_text(encoding='utf-8').strip() == expected_ads, 'ads.txt no coincide con el publisher autorizado'

          checked = 0
          for path in future.candidates():
              if not path.is_file():
                  continue
              source = path.read_text(encoding='utf-8')
              assert source.count('/site-runtime.css?v=20260821') == 1, f'{path}: runtime CSS ausente o duplicado'
              assert source.count('/site-runtime.js?v=20260821') == 1, f'{path}: runtime JS ausente o duplicado'
              assert '/future-experience.js?v=1' not in source, f'{path}: conserva carga JS fragmentada'
              if future.adsense_allowed(path):
                  assert source.count(future.ADSENSE_URL) == 1, f'{path}: AdSense debe aparecer exactamente una vez'
                  head, sep, _ = source.partition('</head>')
                  assert sep and future.ADSENSE_URL in head, f'{path}: el script de AdSense no está dentro de <head>'
                  assert 'crossorigin="anonymous"' in head, f'{path}: falta crossorigin de AdSense'
              else:
                  assert 'adsbygoogle' not in source and future.ADSENSE_CLIENT not in source, f'{path}: AdSense prohibido en esta ruta'
              checked += 1
          if checked < 50:
              raise SystemExit(f'Solo se verificaron {checked} páginas; se esperaban al menos 50')
          print(f'PASS: experiencia futura v4 + buscador global + política AdSense verificados en {checked} páginas; ads.txt válido')
          PY
          python3 scripts/validate-adsense-policy.py

      - name: Stagear todas las salidas publicables
        run: |
          git add sitemap.xml seo-manifest.json seo-cluster-manifest.json trials/ medicina-critica/ medicina-interna/ metodologia/ equipo-editorial/ resumen/ images/trials/ _includes/index-source.html interactive-home.js internal-medicine-ux.js
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import aplicar_experiencia_futura as future

          root = Path.cwd().resolve()
          candidates = []
          for path in future.candidates():
              if not path.is_file():
                  continue
              candidates.append(str(path.resolve().relative_to(root)))
          if not candidates:
              raise SystemExit('No se encontraron candidatos de experiencia futura para stagear')
          subprocess.run(['git', 'add', '--', *candidates], check=True)
          print(f'Stageados {len(candidates)} candidatos de experiencia futura')
          PY

      - name: Verificar que ningún candidato quede fuera del commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import aplicar_experiencia_futura as future

          root = Path.cwd().resolve()
          unstaged = []
          for path in future.candidates():
              if not path.is_file():
                  continue
              rel = str(path.resolve().relative_to(root))
              rc = subprocess.run(['git', 'diff', '--quiet', '--', rel]).returncode
              if rc != 0:
                  unstaged.append(rel)
          if unstaged:
              raise SystemExit('Candidatos modificados sin stagear: ' + ', '.join(unstaged))
          print('PASS: ningún candidato de experiencia futura quedó fuera del commit')
          PY

      - name: Guardar salidas regeneradas en la rama del PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --cached --quiet; then
            echo "Las salidas ya estaban actualizadas en el PR."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerar experiencia futura v4 con AdSense"
          git push origin "HEAD:${HEAD_REF}"

      - name: Rechazar derivados faltantes en main o PR externo
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if git diff --cached --quiet; then
            echo "PASS: las salidas derivadas ya estaban materializadas."
            exit 0
          fi
          echo "Las salidas derivadas no están materializadas en el commit. Deben incorporarse mediante un PR; main protegido no admite pushes automáticos." >&2
          git diff --cached --stat >&2
          exit 1
