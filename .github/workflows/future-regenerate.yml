name: Verificar regeneración de experiencia futura

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'site_templates.py'
      - 'templates/**'
      - 'scripts/design-browser-suites.mjs'
      - "aplicar_experiencia_futura.py"
      - "ui/site.css"
      - "ui/site.css"
      - "ui/archive.js"
      - "ui/site.css"
      - "ui/core.js"
      - "ui/reader.js"
      - "ui/forms.js"
      - "ui/core.js"
      - "ui/reader.js"
      - "scripts/build-site-runtime.mjs"
      - ".github/workflows/future-regenerate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-experiencia-futura-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Validar generadores e inyector
        run: |
          python -m py_compile generar_seo.py generar_seo_clusters.py generar_seo_semantico.py generar_seo_avanzado.py restaurar_arquitectura.py actualizar_agregar_editorial.py aplicar_experiencia_futura.py generar_paginas_sociales.py
          node --check ui/archive.js
          node --check ui/core.js
          node --check ui/reader.js
          node --check ui/forms.js
          node --check ui/core.js
          node --check ui/reader.js
          node --check ui/pdf.js
          node --check ui/pdf.js
          node --check scripts/adsense-production-smoke.mjs
          node scripts/build-site-runtime.mjs
          node --check site-runtime.js

      - name: Regenerar sitio completo en memoria de trabajo
        run: |
          node scripts/build-site-runtime.mjs
          python generar_seo.py
          python generar_seo_semantico.py
          python generar_seo_avanzado.py
          python restaurar_arquitectura.py
          python actualizar_agregar_editorial.py
          python generar_paginas_sociales.py
          python aplicar_experiencia_futura.py

      - name: Verificar experiencia v4 y AdSense en todas las salidas
        run: |
          python3 scripts/validate-design.py
          python3 scripts/validate-adsense-policy.py

      - name: Confirmar que main ya contiene todas las salidas derivadas
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "main contiene deriva respecto de los generadores. Las salidas deben materializarse en una rama y entrar por PR." >&2
            git status --short >&2
            exit 1
          fi
          echo "PASS: main ya contiene todas las salidas derivadas; no se realizó ningún push automático."
