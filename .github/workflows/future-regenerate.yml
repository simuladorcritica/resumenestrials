name: Regenerar experiencia futura

on:
  push:
    branches: [main]
    paths:
      - "aplicar_experiencia_futura.py"
      - "future-experience.css"
      - "future-experience-patch.css"
      - "future-experience.js"
      - "future-experience-final.js"
      - "future-experience-fix-v4.js"
      - "future-experience-fix-v4-compat.js"
      - "legacy-unifier-v4.js"
      - ".github/workflows/future-regenerate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-sitio-derivado-main
  cancel-in-progress: false

jobs:
  regenerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Validar generadores e inyector
        run: |
          python -m py_compile generar_seo.py generar_seo_clusters.py generar_seo_semantico.py generar_seo_avanzado.py restaurar_arquitectura.py actualizar_agregar_editorial.py aplicar_experiencia_futura.py generar_paginas_sociales.py
          node --check future-experience.js
          node --check future-experience-final.js
          node --check future-experience-fix-v4.js
          node --check future-experience-fix-v4-compat.js
          node --check legacy-unifier-v4.js
          node --check legacy-reader-design-v5.js
          node --check pdf-contact.js
          node --check trial-pdf.js

      - name: Regenerar sitio completo
        run: |
          python generar_seo.py
          python generar_seo_semantico.py
          python generar_seo_avanzado.py
          python restaurar_arquitectura.py
          python actualizar_agregar_editorial.py
          python generar_paginas_sociales.py
          python aplicar_experiencia_futura.py

      - name: Verificar experiencia v4 en todas las salidas
        run: |
          python - <<'PY'
          from pathlib import Path
          import aplicar_experiencia_futura as future

          checked = 0
          for path in future.candidates():
              if not path.is_file():
                  continue
              source = path.read_text(encoding='utf-8')
              assert '/future-experience.css?v=1' in source, f'{path}: falta CSS futuro'
              assert '/future-experience-patch.css?v=1' in source, f'{path}: falta patch CSS futuro'
              assert '/future-experience.js?v=1' in source, f'{path}: falta JS futuro'
              assert '/future-experience-final.js?v=3' in source, f'{path}: falta ajuste final v3'
              assert '/future-experience-fix-v4.js?v=1' in source, f'{path}: falta unificación v4'
              assert '/future-experience-fix-v4-compat.js?v=1' in source, f'{path}: falta candado tipográfico v4'
              assert '/legacy-unifier-v4.js?v=1' in source, f'{path}: falta unificador legacy v4'
              assert '/future-experience-final.js?v=1' not in source, f'{path}: conserva ajuste final v1 obsoleto'
              assert '/future-experience-final.js?v=2' not in source, f'{path}: conserva ajuste final v2 obsoleto'
              checked += 1
          if checked < 50:
              raise SystemExit(f'Solo se verificaron {checked} páginas; se esperaban al menos 50')
          print(f'PASS: experiencia futura v4 verificada en {checked} páginas')
          PY

      - name: Stagear todas las salidas publicables
        run: |
          git add sitemap.xml seo-manifest.json seo-cluster-manifest.json trials/ medicina-critica/ medicina-interna/ metodologia/ equipo-editorial/ resumen/ images/trials/ _includes/index-source.html interactive-home.js internal-medicine-ux.js
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import aplicar_experiencia_futura as future

          root = Path.cwd().resolve()
          candidates = []
          for path in future.candidates():
              if not path.is_file():
                  continue
              candidates.append(str(path.resolve().relative_to(root)))
          if not candidates:
              raise SystemExit('No se encontraron candidatos de experiencia futura para stagear')
          subprocess.run(['git', 'add', '--', *candidates], check=True)
          print(f'Stageados {len(candidates)} candidatos de experiencia futura')
          PY

      - name: Verificar que ningún candidato quede fuera del commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import aplicar_experiencia_futura as future

          root = Path.cwd().resolve()
          unstaged = []
          for path in future.candidates():
              if not path.is_file():
                  continue
              rel = str(path.resolve().relative_to(root))
              rc = subprocess.run(['git', 'diff', '--quiet', '--', rel]).returncode
              if rc != 0:
                  unstaged.append(rel)
          if unstaged:
              raise SystemExit('Candidatos modificados sin stagear: ' + ', '.join(unstaged))
          print('PASS: ningún candidato de experiencia futura quedó fuera del commit')
          PY

      - name: Guardar salidas regeneradas
        run: |
          if git diff --cached --quiet; then
            echo "Las salidas ya estaban actualizadas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerar experiencia futura v4"
          git push origin HEAD:main
