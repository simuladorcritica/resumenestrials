name: Auditoria integral del sitio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-site-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Generar exactamente el sitio que será publicado
        run: |
          python3 -m pip install --disable-pip-version-check pillow==11.3.0
          node scripts/build-site-runtime.mjs
          python3 generar_seo.py
          python3 generar_seo_semantico.py
          python3 generar_seo_avanzado.py
          python3 restaurar_arquitectura.py
          python3 actualizar_agregar_editorial.py
          python3 generar_paginas_sociales.py
          python3 aplicar_experiencia_futura.py
      - name: Instalar navegador de auditoría
        run: |
          npm install
          npx playwright install --with-deps chromium webkit
      - name: Servir sitio localmente
        run: |
          python3 -m http.server 8000 >/tmp/rt-full-audit-http.log 2>&1 &
          sleep 3
      - name: Auditoría funcional integral
        env:
          RT_BASE_URL: http://127.0.0.1:8000
        run: node scripts/full-site-audit.mjs
