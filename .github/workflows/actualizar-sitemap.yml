name: Actualizar sitio derivado y SEO

on:
  push:
    branches:
      - main
    paths:
      - "resumenes.json"
      - "generar_seo.py"
      - "generar_paginas_sociales.py"
      - "trial.css"
      - "seo-routing.js"
      - "legacy-seo.js"
      - ".github/workflows/actualizar-sitemap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-sitio-derivado-main
  cancel-in-progress: false

jobs:
  actualizar-sitio:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Validar generadores
        run: python -m py_compile generar_seo.py generar_paginas_sociales.py

      - name: Generar paginas SEO y sitemap
        run: python generar_seo.py

      - name: Generar paginas sociales por trial
        run: python generar_paginas_sociales.py

      - name: Verificar salida SEO
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          datos = json.loads(Path('resumenes.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('seo-manifest.json').read_text(encoding='utf-8'))
          if len(manifest) != len(datos):
              raise SystemExit(f'Manifiesto incompleto: {len(manifest)} de {len(datos)}')
          for item in datos:
              entry = manifest.get(str(item['id']))
              if not entry:
                  raise SystemExit(f'Falta id {item["id"]} en seo-manifest.json')
              page = Path(entry['path'].lstrip('/')) / 'index.html'
              if not page.is_file():
                  raise SystemExit(f'No existe {page}')
              source = page.read_text(encoding='utf-8')
              if entry['url'] not in source or '<link rel="canonical"' not in source:
                  raise SystemExit(f'Canonical SEO invalida en {page}')
          ET.parse('sitemap.xml')
          print(f'PASS: {len(datos)} paginas SEO y sitemap valido')
          PY

      - name: Guardar archivos derivados
        run: |
          if git diff --quiet -- sitemap.xml seo-manifest.json trials/ medicina-critica/ medicina-interna/ resumen/; then
            echo "Las paginas derivadas y el SEO ya estan actualizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml seo-manifest.json trials/ medicina-critica/ medicina-interna/ resumen/
          git commit -m "Actualizar paginas SEO y sitemap automaticamente"
          git push origin HEAD:main
