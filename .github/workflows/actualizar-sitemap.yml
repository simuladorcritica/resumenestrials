name: Actualizar sitio derivado y SEO

on:
  pull_request:
    branches: [main]
    paths:
      - 'ui/**'
      - 'site_templates.py'
      - 'templates/**'
      - 'scripts/design-browser-suites.mjs'
      - "resumenes.json"
      - "generar_seo.py"
      - "generar_seo_clusters.py"
      - "generar_seo_semantico.py"
      - "generar_seo_avanzado.py"
      - "restaurar_arquitectura.py"
      - "actualizar_agregar_editorial.py"
      - "agregar-editorial-dates.js"
      - "generar_paginas_sociales.py"
      - "aplicar_experiencia_futura.py"
      - "ui/site.css"
      - "ui/site.css"
      - "ui/archive.js"
      - "ui/site.css"
      - "ui/core.js"
      - "ui/reader.js"
      - "ui/forms.js"
      - "ui/core.js"
      - "ui/reader.js"
      - "scripts/build-site-runtime.mjs"
      - "seo-clusters.json"
      - "seo-legacy-redirects.json"
      - "scripts/article-inventory.mjs"
      - "scripts/validate-article-indexability.mjs"
      - "ui/site.css"
      - "ui/site.css"
      - "ui/site.css"
      - "ui/pdf.js"
      - "ui/pdf.js"
      - "ui/core.js"
      - "ui/reader.js"
      - "ui/archive.js"
      - "specialty-classification.js"
      - "_includes/index-source.html"
      - ".github/workflows/actualizar-sitemap.yml"
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'site_templates.py'
      - 'templates/**'
      - 'scripts/design-browser-suites.mjs'
      - "resumenes.json"
      - "generar_seo.py"
      - "generar_seo_clusters.py"
      - "generar_seo_semantico.py"
      - "generar_seo_avanzado.py"
      - "restaurar_arquitectura.py"
      - "actualizar_agregar_editorial.py"
      - "agregar-editorial-dates.js"
      - "generar_paginas_sociales.py"
      - "aplicar_experiencia_futura.py"
      - "ui/site.css"
      - "ui/site.css"
      - "ui/archive.js"
      - "ui/site.css"
      - "ui/core.js"
      - "ui/reader.js"
      - "ui/forms.js"
      - "ui/core.js"
      - "ui/reader.js"
      - "scripts/build-site-runtime.mjs"
      - "seo-clusters.json"
      - "seo-legacy-redirects.json"
      - "scripts/article-inventory.mjs"
      - "scripts/validate-article-indexability.mjs"
      - "ui/site.css"
      - "ui/site.css"
      - "ui/site.css"
      - "ui/pdf.js"
      - "ui/pdf.js"
      - "ui/core.js"
      - "ui/reader.js"
      - "ui/archive.js"
      - "specialty-classification.js"
      - "_includes/index-source.html"
      - ".github/workflows/actualizar-sitemap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materializar-sitio-derivado-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  actualizar-sitio:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar rama del PR
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Descargar main
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Instalar generador de imágenes
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Validar generadores y construir runtime
        run: |
          python -m py_compile generar_seo.py generar_seo_clusters.py generar_seo_semantico.py generar_seo_avanzado.py restaurar_arquitectura.py actualizar_agregar_editorial.py generar_paginas_sociales.py aplicar_experiencia_futura.py
          node scripts/build-site-runtime.mjs
          node --check site-runtime.js

      - name: Generar paginas SEO y sitemap
        run: |
          node scripts/build-site-runtime.mjs
          python generar_seo.py

      - name: Generar clusters y transparencia editorial
        run: python generar_seo_semantico.py

      - name: Generar SEO no visual, imágenes sociales y portada prerenderizada
        run: python generar_seo_avanzado.py

      - name: Restaurar arquitectura editorial visible
        run: python restaurar_arquitectura.py

      - name: Activar fechas editoriales en panel de carga
        run: python actualizar_agregar_editorial.py

      - name: Generar paginas sociales por trial
        run: python generar_paginas_sociales.py

      - name: Aplicar experiencia final a todas las superficies publicables
        run: python aplicar_experiencia_futura.py

      - name: Validar cobertura dinámica JSON, páginas y sitemap
        run: node scripts/validate-article-indexability.mjs

      - name: Verificar salida SEO y arquitectura
        run: |
          python3 scripts/validate-design.py

      - name: Stagear archivos derivados
        run: |
          git add sitemap.xml seo-manifest.json seo-cluster-manifest.json trials/ medicina-critica/ medicina-interna/ metodologia/ equipo-editorial/ resumen/ images/trials/ _includes/index-source.html ui/runtime-version.json agregar.html index.html resumen.html privacidad.html login.html registro.html recuperar.html cuenta.html biblioteca.html privacidad/ terminos/ 404.html site-runtime.js site-runtime.css
          python3 scripts/validate-design.py

      - name: Guardar archivos derivados en la rama del PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --cached --quiet; then
            echo "Las paginas derivadas, el runtime y el SEO ya estan actualizados en el PR."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materializar sitio derivado antes del merge"
          git push origin "HEAD:${HEAD_REF}"

      - name: Rechazar derivados faltantes en main o PR externo
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if git diff --cached --quiet; then
            echo "PASS: las paginas derivadas ya estaban materializadas."
            exit 0
          fi
          echo "Las paginas derivadas difieren del commit publicado. Deben materializarse en una rama y entrar por PR; main protegido no admite pushes automáticos." >&2
          git diff --cached --stat >&2
          exit 1
