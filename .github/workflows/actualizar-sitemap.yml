name: Actualizar sitemap

on:
  push:
    branches:
      - main
    paths:
      - "resumenes.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-sitemap-main
  cancel-in-progress: false

jobs:
  actualizar-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Generar sitemap.xml
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          BASE_URL = "https://resumenestrials.com"
          JSON_PATH = Path("resumenes.json")
          SITEMAP_PATH = Path("sitemap.xml")

          with JSON_PATH.open("r", encoding="utf-8") as f:
              datos = json.load(f)

          if not isinstance(datos, list):
              raise ValueError("resumenes.json debe contener una lista de resúmenes")

          ids = []

          for resumen in datos:
              if not isinstance(resumen, dict) or "id" not in resumen:
                  raise ValueError(
                      "Cada resumen debe ser un objeto con un campo 'id'"
                  )

              ids.append(str(resumen["id"]))

          if len(ids) != len(set(ids)):
              raise ValueError("Hay IDs duplicados en resumenes.json")

          urls = [f"{BASE_URL}/"]

          urls.extend(
              f"{BASE_URL}/resumen.html?id={id_}"
              for id_ in ids
          )

          lineas = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',
          ]

          for url in urls:
              lineas.extend([
                  "  <url>",
                  f"    <loc>{url}</loc>",
                  "  </url>",
              ])

          lineas.append("</urlset>")

          SITEMAP_PATH.write_text(
              "\n".join(lineas) + "\n",
              encoding="utf-8"
          )

          print(
              f"Sitemap generado correctamente con {len(urls)} URLs."
          )
          PY

      - name: Guardar sitemap actualizado
        shell: bash
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml ya está actualizado; no hay cambios que guardar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml
          git commit -m "Actualizar sitemap automáticamente"
          git push origin HEAD:main
