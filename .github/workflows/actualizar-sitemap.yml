name: Actualizar sitio derivado y SEO

on:
  push:
    branches:
      - main
    paths:
      - "resumenes.json"
      - "generar_seo.py"
      - "generar_seo_clusters.py"
      - "generar_seo_semantico.py"
      - "generar_seo_avanzado.py"
      - "restaurar_arquitectura.py"
      - "actualizar_agregar_editorial.py"
      - "agregar-editorial-dates.js"
      - "seo-clusters.json"
      - "seo-legacy-redirects.json"
      - "scripts/article-inventory.mjs"
      - "scripts/validate-article-indexability.mjs"
      - "seo-semantic.css"
      - "seo-pro.css"
      - "generar_paginas_sociales.py"
      - "trial.css"
      - "trial-pdf.js"
      - "pdf-contact.js"
      - "seo-routing.js"
      - "legacy-seo.js"
      - "interactive-home.js"
      - "internal-medicine-ux.js"
      - "_includes/index-source.html"
      - ".github/workflows/actualizar-sitemap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-sitio-derivado-main
  cancel-in-progress: false

jobs:
  actualizar-sitio:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Instalar generador de imágenes
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Validar generadores
        run: python -m py_compile generar_seo.py generar_seo_clusters.py generar_seo_semantico.py generar_seo_avanzado.py restaurar_arquitectura.py actualizar_agregar_editorial.py generar_paginas_sociales.py

      - name: Generar paginas SEO y sitemap
        run: python generar_seo.py

      - name: Generar clusters y transparencia editorial
        run: python generar_seo_semantico.py

      - name: Generar SEO no visual, imágenes sociales y portada prerenderizada
        run: python generar_seo_avanzado.py

      - name: Restaurar arquitectura editorial visible
        run: python restaurar_arquitectura.py

      - name: Activar fechas editoriales en panel de carga
        run: python actualizar_agregar_editorial.py

      - name: Generar paginas sociales por trial
        run: python generar_paginas_sociales.py

      - name: Validar cobertura dinámica JSON, páginas y sitemap
        run: node scripts/validate-article-indexability.mjs

      - name: Verificar salida SEO y arquitectura
        run: |
          python - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          datos = json.loads(Path('resumenes.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('seo-manifest.json').read_text(encoding='utf-8'))
          clusters = json.loads(Path('seo-cluster-manifest.json').read_text(encoding='utf-8'))

          if len(manifest) != len(datos):
              raise SystemExit(f'Manifiesto incompleto: {len(manifest)} de {len(datos)}')

          home = Path('_includes/index-source.html').read_text(encoding='utf-8')
          if '<!-- RT-PRERENDER-START -->' not in home or home.count('class="fila" data-id=') < len(datos):
              raise SystemExit('La portada no quedó prerenderizada con todos los trials')
          if 'jspdf.umd.min.js" defer' in home:
              raise SystemExit('jsPDF sigue bloqueando la carga inicial')

          ux = Path('internal-medicine-ux.js').read_text(encoding='utf-8')
          if 'const direct = row?.dataset?.id;' not in ux:
              raise SystemExit('Las descargas de portada no reconocen las filas con URL canónica')
          if 'await window.cargarJsPDF();' not in ux:
              raise SystemExit('La descarga breve no carga jsPDF bajo demanda')
          if not Path('trial-pdf.js').is_file():
              raise SystemExit('Falta el controlador PDF de los trials canónicos')

          for item in datos:
              entry = manifest.get(str(item['id']))
              if not entry:
                  raise SystemExit(f'Falta id {item["id"]} en seo-manifest.json')
              page = Path(entry['path'].lstrip('/')) / 'index.html'
              if not page.is_file():
                  raise SystemExit(f'No existe {page}')
              source = page.read_text(encoding='utf-8')
              if entry['url'] not in source or '<link rel="canonical"' not in source:
                  raise SystemExit(f'Canonical SEO invalida en {page}')
              if '/metodologia/' not in source or '/equipo-editorial/' not in source:
                  raise SystemExit(f'Faltan enlaces de transparencia en {page}')
              if 'RT-HERO-START' in source or 'class="trial-hero"' in source:
                  raise SystemExit(f'La portada gráfica volvió a invadir el artículo: {page}')
              if 'RT-INTENT-START' in source or 'class="respuesta-clinica"' in source:
                  raise SystemExit(f'El resumen rápido duplicado volvió a aparecer: {page}')
              if 'id="resumen-breve"' in source or 'class="resumen-breve"' in source:
                  raise SystemExit(f'El resumen breve volvió a incrustarse dentro del completo: {page}')
              if re.search(r'<img[^>]+images/trials/', source):
                  raise SystemExit(f'Hay una imagen social visible dentro del artículo: {page}')
              if '<article class="articulo">' not in source:
                  raise SystemExit(f'Falta el artículo con la arquitectura original: {page}')
              if f'data-trial-download="{item["id"]}"' not in source:
                  raise SystemExit(f'Falta descarga PDF completa en {page}')
              if '/trial-pdf.js?v=1' not in source:
                  raise SystemExit(f'Falta el controlador PDF en {page}')
              if '/trial.css?v=2' not in source:
                  raise SystemExit(f'El trial no usa los estilos unificados: {page}')
              if item.get('corto') and f'/resumen.html?id={item["id"]}&amp;v=corto' not in source:
                  raise SystemExit(f'Falta enlace a la lectura breve independiente en {page}')
              images = entry.get('images') or []
              if len(images) != 3:
                  raise SystemExit(f'Faltan variantes de imagen social en id {item["id"]}')
              if not all(url in source for url in images):
                  raise SystemExit(f'Las imágenes dejaron de estar en los metadatos estructurados: id {item["id"]}')
              for image_url in images:
                  local = Path(image_url.replace('https://resumenestrials.com/', ''))
                  if not local.is_file():
                      raise SystemExit(f'No existe imagen {local}')
              for cluster in entry.get('clusters', []):
                  if cluster['path'] not in source:
                      raise SystemExit(f'Falta enlace semantico {cluster["path"]} en {page}')

          for slug, cluster in clusters.items():
              page = Path(cluster['path'].lstrip('/')) / 'index.html'
              if not page.is_file():
                  raise SystemExit(f'No existe cluster {slug}: {page}')
              source = page.read_text(encoding='utf-8')
              if cluster['count'] < 2:
                  raise SystemExit(f'Cluster demasiado pequeño: {slug}')
              if 'RT-CLUSTER-SYNTHESIS-START' in source or 'class="cluster-synthesis"' in source:
                  raise SystemExit(f'El cluster {slug} volvió a duplicar todos los resúmenes')
              if '<section class="cat-grid">' not in source:
                  raise SystemExit(f'El cluster {slug} perdió su arquitectura de colección')

          # Regresiones semánticas conocidas que no deben volver.
          if '24' in [str(x) for x in clusters.get('sepsis-shock', {}).get('trial_ids', [])]:
              raise SystemExit('REBOARREST no pertenece al cluster de sepsis/shock')
          if '18' in [str(x) for x in clusters.get('neurologia', {}).get('trial_ids', [])]:
              raise SystemExit('VESALIUS-CV no debe clasificarse como trial de Neurología por mencionar “ni ictus previos”')

          for page in [Path('metodologia/index.html'), Path('equipo-editorial/index.html')]:
              source = page.read_text(encoding='utf-8') if page.is_file() else ''
              if '<link rel="canonical"' not in source or 'sameAs' not in source:
                  raise SystemExit(f'Pagina editorial invalida o entidad incompleta: {page}')

          if '/agregar-editorial-dates.js?v=1' not in Path('agregar.html').read_text(encoding='utf-8'):
              raise SystemExit('El panel de carga no registra fechas editoriales')

          tree = ET.parse('sitemap.xml')
          locs = {node.text for node in tree.getroot().iter() if node.tag.endswith('loc')}
          required = {
              'https://resumenestrials.com/metodologia/',
              'https://resumenestrials.com/equipo-editorial/',
          }
          required.update(cluster['url'] for cluster in clusters.values())
          missing = required - locs
          if missing:
              raise SystemExit(f'Faltan URLs en sitemap: {sorted(missing)}')

          print(f'PASS: {len(datos)} trials unificados, resumen breve independiente, PDF completo, {len(clusters)} clusters limpios y portada prerenderizada')
          PY

      - name: Guardar archivos derivados
        run: |
          if git diff --quiet -- sitemap.xml seo-manifest.json seo-cluster-manifest.json trials/ medicina-critica/ medicina-interna/ metodologia/ equipo-editorial/ resumen/ images/trials/ _includes/index-source.html interactive-home.js internal-medicine-ux.js agregar.html; then
            echo "Las paginas derivadas y el SEO ya estan actualizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml seo-manifest.json seo-cluster-manifest.json trials/ medicina-critica/ medicina-interna/ metodologia/ equipo-editorial/ resumen/ images/trials/ _includes/index-source.html interactive-home.js internal-medicine-ux.js agregar.html
          git commit -m "Actualizar SEO respetando arquitectura editorial"
          git push origin HEAD:main
