name: Resumenes Trials Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate JavaScript syntax
        run: |
          node --check interactive-home.js
          node --check library-store.js
          node --check client-monitor.js
          node --check app-version.js
          node --check runtime-consistency.js
          node --check scripts/validate-data.mjs
          node --check scripts/production-health.mjs
          node --check scripts/browser-smoke.mjs
      - name: Validate resumenes.json
        run: node scripts/validate-data.mjs

  production-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check production endpoints
        run: node scripts/production-health.mjs

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: node scripts/browser-smoke.mjs
