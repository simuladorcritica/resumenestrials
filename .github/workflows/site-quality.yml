name: Resumenes Trials Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  data-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check newsletter deployment readiness
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then echo "SUPABASE_ACCESS_TOKEN: configured"; else echo "SUPABASE_ACCESS_TOKEN: missing"; fi
          if [ -n "$RESEND_API_KEY" ]; then echo "RESEND_API_KEY: configured"; else echo "RESEND_API_KEY: missing"; fi
      - name: Validate GitHub Actions callback token
        env:
          CALLBACK_GITHUB_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const token = process.env.CALLBACK_GITHUB_TOKEN;
          const response = await fetch('https://api.github.com/installation/repositories?per_page=100', {
            headers: {
              'Authorization': `Bearer ${token}`,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'resumenestrials-newsletter-validation/1.0'
            }
          });
          if (!response.ok) throw new Error(`GitHub installation token validation HTTP ${response.status}`);
          const payload = await response.json();
          const ok = (payload.repositories || []).some((repo) => repo.full_name === 'simuladorcritica/resumenestrials');
          if (!ok) throw new Error('El GITHUB_TOKEN no demuestra acceso a simuladorcritica/resumenestrials');
          console.log('GitHub Actions installation token: PASS');
          NODE
      - name: Validate JavaScript syntax
        run: |
          node --check interactive-home.js
          node --check recommendations.js
          node --check library-store.js
          node --check client-monitor.js
          node --check app-version.js
          node --check runtime-consistency.js
          node --check internal-medicine-ux.js
          node --check home-visual-tuning.js
          node --check pdf-contact.js
          node --check home-control-layout.js
          node --check tools/revisar_pagina_pdf.mjs
          node --check tools/auditoria_sitio_profunda.mjs
          node --check scripts/download-contract-smoke.mjs
          node --check scripts/validate-data.mjs
          node --check scripts/production-health.mjs
          node --check scripts/browser-smoke.mjs
          node --check scripts/validate-inline-modules.mjs
          node --check scripts/validate-editorial.mjs
          node --check scripts/validate-resumen-page.mjs
          node --check scripts/validate-night-audit.mjs
          node --check scripts/validate-newsletter.mjs
      - name: Validate Supabase Edge Function
        run: deno check supabase/functions/notify-new-summaries/index.ts
      - name: Validate Python audit syntax
        run: |
          python3 -m py_compile tools/validar_resumenes.py
          python3 -m py_compile tools/auditoria_editorial_profunda.py
      - name: Validate embedded module scripts
        run: node scripts/validate-inline-modules.mjs
      - name: Validate article detail page
        run: node scripts/validate-resumen-page.mjs
      - name: Validate nightly audit integration
        run: node scripts/validate-night-audit.mjs
      - name: Validate newsletter integration
        run: node scripts/validate-newsletter.mjs
      - name: Validate resumenes.json
        run: node scripts/validate-data.mjs
      - name: Validate editorial architecture
        run: node scripts/validate-editorial.mjs

  download-contract-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install PDF inspection and Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve branch locally
        run: |
          python3 -m http.server 8000 >/tmp/rt-http.log 2>&1 &
          sleep 3
      - name: Validate visible download contract and PDF contact
        env:
          RT_BASE_URL: http://127.0.0.1:8000
        run: node scripts/download-contract-smoke.mjs

  production-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check production endpoints
        run: node scripts/production-health.mjs

  browser-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: node scripts/browser-smoke.mjs
