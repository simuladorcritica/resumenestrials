name: Resumenes Trials Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
    inputs:
      confirmation:
        description: Escribe SEND_ONE_QA_EMAIL sólo para ejecutar la prueba QA de un destinatario
        required: false
        default: ''
        type: string

run-name: ${{ inputs.confirmation == 'SEND_ONE_QA_EMAIL' && 'QA Resend - single_recipient' || github.workflow }}

permissions:
  contents: read
  actions: read

jobs:
  data-validation:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.confirmation != 'SEND_ONE_QA_EMAIL' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check newsletter deployment readiness
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "SUPABASE_ACCESS_TOKEN: missing" >&2; exit 1; }
          [ -n "$RESEND_API_KEY" ] || { echo "RESEND_API_KEY: missing" >&2; exit 1; }
          echo "SUPABASE_ACCESS_TOKEN: configured"
          echo "RESEND_API_KEY: configured"
      - name: Validate GitHub Actions callback token
        env:
          CALLBACK_GITHUB_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const token = process.env.CALLBACK_GITHUB_TOKEN;
          const response = await fetch('https://api.github.com/installation/repositories?per_page=100', {
            headers: {
              'Authorization': `Bearer ${token}`,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'resumenestrials-newsletter-validation/1.0'
            }
          });
          if (!response.ok) throw new Error(`GitHub installation token validation HTTP ${response.status}`);
          const payload = await response.json();
          const ok = (payload.repositories || []).some((repo) => repo.full_name === 'simuladorcritica/resumenestrials');
          if (!ok) throw new Error('El GITHUB_TOKEN no demuestra acceso a simuladorcritica/resumenestrials');
          console.log('GitHub Actions installation token: PASS');
          NODE
      - name: Validate JavaScript syntax
        run: |
          node --check interactive-home.js
          node --check agregar-editorial-dates.js
          node --check recommendations.js
          node --check library-store.js
          node --check client-monitor.js
          node --check app-version.js
          node --check runtime-consistency.js
          node --check internal-medicine-ux.js
          node --check home-visual-tuning.js
          node --check pdf-contact.js
          node --check trial-pdf.js
          node --check home-control-layout.js
          node --check turnstile.js
          node --check tools/revisar_pagina_pdf.mjs
          node --check tools/auditoria_sitio_profunda.mjs
          node --check scripts/download-contract-smoke.mjs
          node --check scripts/auth-production-smoke.mjs
          node --check scripts/home-controls-smoke.mjs
          node --check scripts/validate-data.mjs
          node --check scripts/production-health.mjs
          node --check scripts/browser-smoke.mjs
          node --check scripts/auth-safe-smoke.mjs
          node --check scripts/turnstile-test-helpers.mjs
          node --check scripts/validate-inline-modules.mjs
          node --check scripts/validate-editorial.mjs
          node --check scripts/validate-resumen-page.mjs
          node --check scripts/validate-night-audit.mjs
          node --check scripts/validate-newsletter.mjs
          node --check scripts/validate-sitemap.mjs
          node --check scripts/validate-seo.mjs
          node --check scripts/validate-feed.mjs
          node --check scripts/seo-audit.mjs
          node --check scripts/seo-opportunities.mjs
          node --check scripts/send-private-gsc-report.mjs
          node --check scripts/send-private-gsc-report.test.mjs
          node --check scripts/gsc-privacy-regression.test.mjs
          node --check scripts/validate-legal-oauth.mjs
          node --check scripts/verify-trial-body-freeze.mjs
          node --check scripts/reader-buttons-production-smoke.mjs
          node --check scripts/reader-runtime-contract.mjs
          node --check scripts/reader-runtime-contract.test.mjs
          node --check scripts/resend-qa-single-recipient.mjs
          node --check scripts/resend-qa-single-recipient.test.mjs
          node --check scripts/resumenes-json-guard.mjs
          node --check scripts/resumenes-json-guard.test.mjs
          node --check scripts/resumenes-json-automation.mjs
          node --check scripts/resumenes-json-automation.test.mjs
          node --check scripts/clinical-additions.test.mjs
      - name: Validate post-deployment maintenance safeguards
        run: |
          node --test scripts/reader-runtime-contract.test.mjs
          node --test scripts/resend-qa-single-recipient.test.mjs
          node --test scripts/gsc-privacy-regression.test.mjs scripts/send-private-gsc-report.test.mjs
      - name: Validate local resumenes.json automation
        shell: pwsh
        run: |
          node --test scripts/resumenes-json-guard.test.mjs scripts/resumenes-json-automation.test.mjs scripts/clinical-additions.test.mjs scripts/specialty-classification.test.mjs
          $parseErrors = @()
          foreach ($script in @('scripts/watch-resumenes-json.ps1', 'scripts/install-resumenes-json-watcher.ps1')) {
            $tokens = $null
            $currentErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$currentErrors
            )
            $parseErrors += $currentErrors
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Validate Supabase Edge Functions
        run: |
          deno check --frozen supabase/functions/notify-new-summaries/index.ts
          deno check --frozen supabase/functions/login-username/index.ts
      - name: Validate Python and SEO generator syntax
        run: |
          python3 -m py_compile tools/validar_resumenes.py
          python3 -m py_compile tools/auditoria_editorial_profunda.py
          python3 -m py_compile scripts/extract-pdf-text.py
          python3 -m py_compile scripts/search-console-fetch.py
          python3 -m py_compile scripts/gsc-oauth-bootstrap.py
          python3 scripts/search-console-auth.test.py
          python3 -m py_compile generar_seo.py
          python3 -m py_compile generar_seo_clusters.py
          python3 -m py_compile generar_seo_semantico.py
          python3 -m py_compile generar_seo_avanzado.py
          python3 -m py_compile restaurar_arquitectura.py
          python3 tools/test_auditoria_editorial_profunda.py
          python3 tools/test_validar_resumenes.py
          python3 -m py_compile actualizar_agregar_editorial.py
          python3 -m py_compile generar_paginas_sociales.py
          python3 -m json.tool seo-clusters.json >/dev/null
      - name: Validate SEO without visual regressions
        run: |
          python3 -m pip install --disable-pip-version-check pillow==11.3.0
          python3 generar_seo.py
          python3 generar_seo_semantico.py
          python3 generar_seo_avanzado.py
          python3 restaurar_arquitectura.py
          python3 actualizar_agregar_editorial.py
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          data=json.loads(Path('resumenes.json').read_text(encoding='utf-8'))
          manifest=json.loads(Path('seo-manifest.json').read_text(encoding='utf-8'))
          home=Path('_includes/index-source.html').read_text(encoding='utf-8')
          assert home.count('class="fila" data-id=') >= len(data)
          assert '<!-- RT-PRERENDER-START -->' in home
          assert 'async function cargarJsPDF()' in home
          assert 'jspdf.umd.min.js" defer' not in home
          assert '/agregar-editorial-dates.js?v=1' in Path('agregar.html').read_text(encoding='utf-8')
          assert Path('trial-pdf.js').is_file()
          for item in data:
              entry=manifest[str(item['id'])]
              assert len(entry.get('images') or []) == 3
              page=Path(entry['path'].lstrip('/'))/'index.html'
              source=page.read_text(encoding='utf-8')
              assert '<!-- RT-HERO-START -->' not in source
              assert 'class="trial-hero"' not in source
              assert '<!-- RT-INTENT-START -->' not in source
              assert 'class="respuesta-clinica"' not in source
              assert 'id="resumen-breve"' not in source
              assert 'class="resumen-breve"' not in source
              assert not re.search(r'<img[^>]+images/trials/', source)
              assert '<article class="articulo">' in source
              assert f'data-trial-download="{item["id"]}"' in source
              assert '/trial-pdf.js?v=1' in source
              if item.get('corto'):
                  assert f'/resumen.html?id={item["id"]}&amp;v=corto' in source
              assert '<link rel="canonical"' in source
              for url in entry['images']:
                  assert url in source
                  assert Path(url.replace('https://resumenestrials.com/','')).is_file()
          clusters=json.loads(Path('seo-cluster-manifest.json').read_text(encoding='utf-8'))
          for slug,c in clusters.items():
              source=(Path(c['path'].lstrip('/'))/'index.html').read_text(encoding='utf-8')
              assert '<!-- RT-CLUSTER-SYNTHESIS-START -->' not in source
              assert 'class="cluster-synthesis"' not in source
              assert '<section class="cat-grid">' in source
          assert '24' not in [str(x) for x in clusters.get('sepsis-shock',{}).get('trial_ids',[])]
          assert '18' not in [str(x) for x in clusters.get('neurologia',{}).get('trial_ids',[])]
          print(f'Unified architecture PASS: {len(data)} trials, {len(clusters)} clusters')
          PY
      - name: Validate embedded module scripts
        run: node scripts/validate-inline-modules.mjs
      - name: Validate article detail page
        run: node scripts/validate-resumen-page.mjs
      - name: Validate nightly audit integration
        run: node scripts/validate-night-audit.mjs
      - name: Validate newsletter integration
        run: node scripts/validate-newsletter.mjs
      - name: Validate resumenes.json
        run: node scripts/validate-data.mjs
      - name: Validate sitemap lastmod semantics
        run: node scripts/validate-sitemap.mjs
      - name: Validate Atom feed
        run: node scripts/validate-feed.mjs
      - name: Validate canonical and Open Graph metadata
        run: node scripts/validate-seo.mjs
      - name: Validate legal pages and Search Console OAuth safeguards
        run: node scripts/validate-legal-oauth.mjs
      - name: Validate crawlability, schema and internal links
        run: node scripts/seo-audit.mjs --output reports/seo-ci.json --fail-on-high
      - name: Validate generated runtime bundle
        run: |
          node scripts/build-site-runtime.mjs
          git diff --exit-code -- site-runtime.js site-runtime.css
      - name: Fetch the exact clinical base commit
        if: github.event_name == 'pull_request'
        env:
          CLINICAL_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$CLINICAL_BASE_REF"
      - name: Protect medical and editorial content
        env:
          CLINICAL_BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: |
          node scripts/verify-clinical-freeze.mjs
          node scripts/verify-trial-body-freeze.mjs
      - name: Validate editorial contract and technical markup
        run: python3 tools/validar_resumenes.py resumenes.json
      - name: Validate editorial architecture
        run: node scripts/validate-editorial.mjs

  download-contract-smoke:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.confirmation != 'SEND_ONE_QA_EMAIL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Generate the exact corrected site under test
        run: |
          python3 -m pip install --disable-pip-version-check pillow==11.3.0
          python3 generar_seo.py
          python3 generar_seo_semantico.py
          python3 generar_seo_avanzado.py
          python3 restaurar_arquitectura.py
          python3 actualizar_agregar_editorial.py
      - name: Install PDF inspection and Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          npm install --no-save playwright@1.62.1 jspdf@4.2.1
          npx playwright install --with-deps chromium
      - name: Serve generated site locally
        run: |
          python3 -m http.server 8000 >/tmp/rt-http.log 2>&1 &
          sleep 3
      - name: Validate unified trial, short summary and PDF contract
        env:
          RT_BASE_URL: http://127.0.0.1:8000
        run: node scripts/download-contract-smoke.mjs

  production-health:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.confirmation != 'SEND_ONE_QA_EMAIL') && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'
      - name: Check production endpoints
        run: node scripts/production-health.mjs

  browser-smoke:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.confirmation != 'SEND_ONE_QA_EMAIL') && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Serve the exact pull request locally
        run: |
          python3 -m http.server 8000 >/tmp/rt-browser-http.log 2>&1 &
          sleep 3
      - name: Browser smoke test
        env:
          RT_BASE_URL: http://127.0.0.1:8000
        run: |
          node scripts/browser-smoke.mjs
          node scripts/auth-safe-smoke.mjs

  resend-qa-single-recipient:
    name: Enviar exactamente un correo QA
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation == 'SEND_ONE_QA_EMAIL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: resend-qa
    concurrency:
      group: resend-qa-single-recipient
      cancel-in-progress: false
    env:
      RESEND_QA_MODE: single_recipient
      RESEND_QA_CONFIRMATION: ${{ inputs.confirmation }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_QA_RECIPIENT: ${{ secrets.RESEND_QA_RECIPIENT }}
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: Probar salvaguardas sin enviar correo
        run: node --test scripts/resend-qa-single-recipient.test.mjs

      - name: Verificar configuración QA sin mostrar valores
        shell: bash
        run: |
          set -euo pipefail
          [ "$RESEND_QA_MODE" = "single_recipient" ] || { echo "Modo QA inválido." >&2; exit 1; }
          [ "$RESEND_QA_CONFIRMATION" = "SEND_ONE_QA_EMAIL" ] || { echo "Falta la confirmación manual exacta." >&2; exit 1; }
          [ -n "$RESEND_API_KEY" ] || { echo "Falta RESEND_API_KEY." >&2; exit 1; }
          [ -n "$RESEND_QA_RECIPIENT" ] || { echo "Falta RESEND_QA_RECIPIENT en el entorno resend-qa." >&2; exit 1; }
          echo "Configuración QA presente; los valores permanecen ocultos."

      - name: Enviar un único correo QA
        run: node scripts/resend-qa-single-recipient.mjs
