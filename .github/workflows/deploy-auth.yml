name: Desplegar y validar autenticacion

on:
  pull_request:
    branches: [main]
    paths:
      - auth.js
      - login.html
      - registro.html
      - recuperar.html
      - turnstile.js
      - turnstile-config.js
      - supabase/functions/login-username/**
      - scripts/auth-production-smoke.mjs
      - .github/workflows/deploy-auth.yml
  push:
    branches: [main]
    paths:
      - auth.js
      - login.html
      - registro.html
      - recuperar.html
      - turnstile.js
      - turnstile-config.js
      - supabase/functions/login-username/**
      - scripts/auth-production-smoke.mjs
      - .github/workflows/deploy-auth.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resumenestrials-auth-production
  cancel-in-progress: false

jobs:
  deploy-and-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PROJECT_REF: hnsmozvatgyrascxbhys
      SUPABASE_URL: https://hnsmozvatgyrascxbhys.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_IfNh1tBO7c5c5u9Kc5_qSQ_QFHHY7wK
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7.0.1

      - name: Verificar credencial de Supabase
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "Falta SUPABASE_ACCESS_TOKEN" >&2; exit 1; }
          [ -n "$TURNSTILE_SECRET_KEY" ] || { echo "Falta TURNSTILE_SECRET_KEY" >&2; exit 1; }
          echo "Credencial de Supabase disponible."

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Validar Edge Function
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Comprobar sintaxis del acceso por usuario
        run: deno check --frozen supabase/functions/login-username/index.ts

      - name: Preparar navegador para la prueba segura de autenticacion
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: Instalar navegador de prueba
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Servir el PR sin conexiones de autenticacion reales
        run: |
          python3 -m http.server 8000 >/tmp/rt-auth-safe-http.log 2>&1 &
          sleep 3

      - name: Probar registro, login y recuperacion en entorno local aislado
        env:
          RT_BASE_URL: http://127.0.0.1:8000
        run: node scripts/auth-safe-smoke.mjs

      - name: Desplegar acceso por nombre de usuario
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy login-username \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt \
            --use-api

      - name: Corregir configuracion Auth y ejecutar prueba integral
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: node scripts/auth-production-smoke.mjs
