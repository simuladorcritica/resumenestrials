name: Desplegar servicio de correo

on:
  push:
    branches: [main]
    paths:
      - supabase/functions/notify-new-summaries/**
      - supabase/config.toml
      - .github/workflows/deploy-newsletter.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-newsletter-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      PROJECT_REF: hnsmozvatgyrascxbhys
      NEWSLETTER_DOMAIN: resumenestrials.com
      NEWSLETTER_FROM: Resúmenes Trials <novedades@resumenestrials.com>
      NEWSLETTER_REPLY_TO: resumenestrials@outlook.com
    steps:
      - uses: actions/checkout@v4

      - name: Verificar credenciales requeridas
        id: credentials
        continue-on-error: true
        run: |
          set -euo pipefail
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "Falta SUPABASE_ACCESS_TOKEN." >&2; exit 1; }
          [ -n "$RESEND_API_KEY" ] || { echo "Falta RESEND_API_KEY." >&2; exit 1; }
          echo "Credenciales de despliegue presentes."

      - name: Validar credencial Resend de mínimo privilegio
        id: resend
        if: steps.credentials.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          salida=$(mktemp)
          codigo=$(curl --silent --show-error \
            --output "$salida" \
            --write-out '%{http_code}' \
            --connect-timeout 10 \
            --max-time 30 \
            --header "Authorization: Bearer $RESEND_API_KEY" \
            --header 'Accept: application/json' \
            https://api.resend.com/domains || true)

          if [ "$codigo" = "200" ]; then
            if ! jq -e --arg domain "$NEWSLETTER_DOMAIN" '.data[]? | select(.name == $domain and .status == "verified")' "$salida" >/dev/null; then
              echo "El dominio $NEWSLETTER_DOMAIN no aparece como verificado en Resend." >&2
              exit 1
            fi
            echo "Credencial Resend válida y dominio verificado."
            exit 0
          fi

          if [ "$codigo" = "401" ] && grep -q 'restricted_api_key' "$salida"; then
            echo "Credencial Resend válida con Sending access; se conserva el principio de mínimo privilegio."
            exit 0
          fi

          echo "La credencial de Resend no superó la validación: HTTP $codigo" >&2
          cat "$salida" >&2 || true
          exit 1

      - uses: supabase/setup-cli@v3
        id: setup
        if: steps.credentials.outcome == 'success' && steps.resend.outcome == 'success'
        continue-on-error: true
        with:
          version: latest

      - name: Configurar secretos del servicio
        id: secrets
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          supabase secrets set \
            --project-ref "$PROJECT_REF" \
            RESEND_API_KEY="$RESEND_API_KEY" \
            NEWSLETTER_FROM="$NEWSLETTER_FROM" \
            NEWSLETTER_REPLY_TO="$NEWSLETTER_REPLY_TO"

      - name: Desplegar Edge Function
        id: deploy
        if: steps.secrets.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          supabase functions deploy notify-new-summaries \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt \
            --use-api

      - name: Verificar servicio desplegado
        id: health
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          endpoint="https://${PROJECT_REF}.supabase.co/functions/v1/notify-new-summaries"
          for intento in 1 2 3 4 5; do
            salida=$(mktemp)
            codigo=$(curl --silent --show-error \
              --output "$salida" \
              --write-out '%{http_code}' \
              --connect-timeout 10 \
              --max-time 30 \
              "$endpoint" || true)
            if [ "$codigo" = "200" ] && grep -q '"service":"notify-new-summaries"' "$salida"; then
              echo "Servicio de correo desplegado y saludable."
              exit 0
            fi
            echo "Comprobación $intento: HTTP $codigo"
            cat "$salida" || true
            echo
            sleep $((intento * 3))
          done
          echo "El servicio no superó la comprobación posterior al despliegue." >&2
          exit 1

      - name: Registrar resultado del despliegue
        if: always()
        env:
          OUTCOME_CREDENTIALS: ${{ steps.credentials.outcome }}
          OUTCOME_RESEND: ${{ steps.resend.outcome }}
          OUTCOME_SETUP: ${{ steps.setup.outcome }}
          OUTCOME_SECRETS: ${{ steps.secrets.outcome }}
          OUTCOME_DEPLOY: ${{ steps.deploy.outcome }}
          OUTCOME_HEALTH: ${{ steps.health.outcome }}
        run: |
          set -euo pipefail
          status="healthy"
          failed_stage=""
          for pair in \
            "credentials:$OUTCOME_CREDENTIALS" \
            "resend:$OUTCOME_RESEND" \
            "setup-cli:$OUTCOME_SETUP" \
            "supabase-secrets:$OUTCOME_SECRETS" \
            "edge-function-deploy:$OUTCOME_DEPLOY" \
            "health-check:$OUTCOME_HEALTH"; do
            stage="${pair%%:*}"
            outcome="${pair#*:}"
            if [ "$outcome" != "success" ]; then
              status="failed"
              failed_stage="$stage"
              break
            fi
          done

          mkdir -p runtime
          deployed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat > runtime/newsletter-deploy-status.json <<EOF
          {
            "service": "notify-new-summaries",
            "status": "$status",
            "failed_stage": "$failed_stage",
            "checked_at": "$deployed_at",
            "source_sha": "$GITHUB_SHA",
            "project_ref": "$PROJECT_REF",
            "domain": "$NEWSLETTER_DOMAIN"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/newsletter-deploy-status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: registrar estado de despliegue newsletter [skip ci]"
            git push origin HEAD:main
          fi

          if [ "$status" != "healthy" ]; then
            echo "El despliegue falló en: $failed_stage" >&2
            exit 1
          fi
          echo "Despliegue saludable y registrado."
