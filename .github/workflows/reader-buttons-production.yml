name: Verificar botones del lector en producción

on:
  push:
    branches: [main]
    paths:
      - "reader-controls-v9.js"
      - "site-runtime.js"
      - "aplicar_experiencia_futura.py"
      - "trial-pdf.js"
      - "scripts/build-site-runtime.mjs"
      - "scripts/reader-buttons-production-smoke.mjs"
      - "scripts/reader-runtime-contract.mjs"
      - "scripts/reader-runtime-contract.test.mjs"
      - ".github/workflows/reader-buttons-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-buttons-production
  cancel-in-progress: false

jobs:
  real-clicks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'
      - name: Validar sintaxis
        run: |
          node --check reader-controls-v9.js
          node --check scripts/reader-buttons-production-smoke.mjs
          node --check scripts/reader-runtime-contract.mjs
          node --test scripts/reader-runtime-contract.test.mjs
          python3 -m py_compile aplicar_experiencia_futura.py
      - name: Instalar Chromium
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Probar controles publicados con interacción física
        id: smoke
        continue-on-error: true
        run: node scripts/reader-buttons-production-smoke.mjs

      - name: Registrar resultado verificable como artefacto
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p runtime
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          outcome = os.environ.get('SMOKE_OUTCOME', 'unknown')
          payload = {
              'service': 'reader-buttons-production',
              'status': 'PASS' if outcome == 'success' else 'FAIL',
              'checked_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'source_sha': os.environ.get('SOURCE_SHA', ''),
              'run_id': os.environ.get('RUN_ID', ''),
              'run_attempt': os.environ.get('RUN_ATTEMPT', ''),
              'site': 'https://resumenestrials.com',
              'trial_id': 1,
              'checks': {
                  'volver_al_indice_pointer': outcome == 'success',
                  'ver_resumen_breve_pointer': outcome == 'success',
                  'descargar_pdf_real': outcome == 'success',
                  'mobile_pointer': outcome == 'success',
              },
          }
          Path('runtime/reader-buttons-production-status.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          {
            echo "## Reader buttons production smoke"
            echo
            echo "- Status: **${SMOKE_OUTCOME}**"
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- Run: ${RUN_ID}.${RUN_ATTEMPT}"
            echo "- Persistence: workflow artifact; no direct push to protected main"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar estado como artefacto
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reader-buttons-production-status-${{ github.run_id }}
          path: runtime/reader-buttons-production-status.json
          if-no-files-found: error
          retention-days: 30

      - name: Fallar si la interacción real no pasó
        if: always() && steps.smoke.outcome != 'success'
        run: |
          echo "La prueba física de los botones del lector no pasó." >&2
          exit 1
