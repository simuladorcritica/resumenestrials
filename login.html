<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · Resumenes Trials</title><meta name="robots" content="noindex,follow"><link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root{--tinta:#12233b;--tinta-2:#38506e;--teal:#1c8a8a;--teal-hondo:#0f5f5f;--papel:#f7f6f2;--linea:#ddd8cc;--err:#a3311f;--ok:#0f5f5f}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--papel);color:var(--tinta);font-family:'Newsreader',Georgia,serif;font-size:18px;line-height:1.55}.wrap{max-width:620px;margin:0 auto;padding:42px 24px 80px}.volver{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-hondo);text-decoration:none}.eyebrow{margin-top:42px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal-hondo)}h1{font-family:'Fraunces',serif;font-size:clamp(36px,7vw,58px);font-weight:600;line-height:1.03;margin:8px 0 12px}.sub{color:var(--tinta-2);margin-bottom:28px}.panel{border-top:1px solid var(--linea);padding-top:28px}.campo{margin-bottom:17px}label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-2);margin-bottom:6px}input{width:100%;font:inherit;color:var(--tinta);background:#fff;border:1px solid var(--linea);border-radius:4px;padding:11px 12px}input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(28,138,138,.12)}button{width:100%;border:1px solid var(--teal-hondo);border-radius:4px;background:var(--teal-hondo);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:13px;padding:13px 18px;cursor:pointer}button:disabled{opacity:.55}.estado{min-height:22px;margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:12px}.err{color:var(--err)}.ok{color:var(--ok)}.pie{text-align:center;margin-top:24px;color:var(--tinta-2);font-size:15px}.pie a{color:var(--teal-hondo)}.recuperar{text-align:right;margin:-7px 0 18px;font-size:14px}.recuperar a{color:var(--teal-hondo)}</style>
</head><body><main class="wrap"><a class="volver" href="index.html">← Volver al sitio</a><div class="eyebrow">Cuenta personal</div><h1>Iniciar sesión</h1><p class="sub">Accede a tu cuenta de Resumenes Trials.</p><form id="login" class="panel"><div class="campo"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" required></div><div class="campo"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div><p class="recuperar"><a href="recuperar.html">¿Olvidaste tu contraseña?</a></p><button id="enviar" type="submit">Iniciar sesión</button><div id="estado" class="estado" role="status" aria-live="polite"></div></form><p class="pie">¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p></main>
<script type="module">import{signInUser}from'./auth.js';const f=document.getElementById('login'),e=document.getElementById('estado'),b=document.getElementById('enviar');const p=new URLSearchParams(location.search);if(p.get('confirmado')==='1'){e.className='estado ok';e.textContent='Correo confirmado. Ya puedes iniciar sesión.';}if(p.get('password')==='actualizada'){e.className='estado ok';e.textContent='Contraseña actualizada. Ya puedes iniciar sesión.';}f.addEventListener('submit',async(ev)=>{ev.preventDefault();if(!f.reportValidity())return;b.disabled=true;b.textContent='Ingresando…';e.textContent='';try{await signInUser({email:document.getElementById('email').value,password:document.getElementById('password').value});location.href='index.html';}catch(err){console.error(err);e.className='estado err';e.textContent='No fue posible iniciar sesión. Verifica tu correo, contraseña y que hayas confirmado tu email.';}finally{b.disabled=false;b.textContent='Iniciar sesión';}});</script></body></html>
