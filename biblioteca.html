<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex,follow"><title>Mi biblioteca · Resúmenes Trials</title><link rel="icon" href="favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
:root{--t:#12233b;--t2:#38506e;--teal:#1c8a8a;--teal2:#0f5f5f;--paper:#f7f6f2;--paper2:#efece4;--line:#ddd8cc;--amber:#c8892a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--t);font:18px/1.6 'Newsreader',Georgia,serif}.topbar{border-bottom:1px solid var(--line);background:rgba(247,246,242,.94)}.top{max-width:1500px;margin:auto;padding:12px clamp(20px,6vw,96px);min-height:78px;display:flex;justify-content:space-between;align-items:center}.brand img{display:block;height:52px;width:auto}.topnav{display:flex;gap:18px;align-items:center}.top a{color:var(--teal2);text-decoration:none}.topnav a{font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase}.page{max-width:1500px;margin:auto;padding:58px clamp(32px,6vw,96px) 90px}.eyebrow,label{font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--t2)}h1{font:500 clamp(50px,7vw,82px)/.98 'Fraunces',serif;letter-spacing:-.025em;margin:9px 0 18px}.lead{color:var(--t2);max-width:720px;font-size:21px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:46px 0 12px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.tools input,.tools select{border:1px solid var(--line);border-radius:3px;background:transparent;padding:10px 13px;color:var(--t)}.tools input{font:13px 'IBM Plex Mono',monospace;flex:1;min-width:250px}.tools select{font:11px 'IBM Plex Mono',monospace;color:var(--t2)}.tools input:focus,.tools select:focus{outline:2px solid rgba(28,138,138,.18);border-color:var(--teal)}.empty{padding:42px 0;color:var(--t2)}.item{border-bottom:1px solid var(--line);padding:30px 0;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}.item h2{font:500 30px/1.16 'Fraunces',serif;margin:8px 0 10px;max-width:52ch}.item h2 a{color:inherit;text-decoration:none}.item h2 a:hover{color:var(--teal2)}.meta{font:11px 'IBM Plex Mono',monospace;letter-spacing:.03em;color:var(--t2)}.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{font:10px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--teal2);border:1px solid rgba(15,95,95,.28);border-radius:2px;padding:3px 8px}.btn{border:0;border-bottom:1px solid rgba(15,95,95,.3);background:transparent;color:var(--teal2);padding:5px 1px;font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.btn:hover{border-color:var(--teal);color:var(--teal)}.status{margin-top:18px;color:var(--t2);font:11px 'IBM Plex Mono',monospace}@media(max-width:650px){.top{min-height:66px;padding:10px 18px}.brand img{height:42px}.page{padding:40px 20px 60px}.item{grid-template-columns:1fr}.tools input,.tools select{width:100%}.topnav{gap:10px}}
</style><link rel="stylesheet" href="/future-experience.css?v=1"><link rel="stylesheet" href="/future-experience-patch.css?v=1"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3132744538918477" crossorigin="anonymous"></script><link rel="stylesheet" href="/global-search.css?v=1"></head><body><header class="topbar"><div class="top"><a class="brand" href="index.html"><img src="logo.png" alt="Resúmenes Trials"></a><nav class="topnav" aria-label="Navegación de cuenta"><a href="index.html">Resúmenes</a><a href="cuenta.html">Mi cuenta</a></nav></div></header><main class="page"><div class="eyebrow">Cuenta personal · evidencia guardada</div><h1>Mi biblioteca</h1><p class="lead">Los resúmenes que decidiste conservar, reunidos con la misma estructura editorial de la biblioteca principal.</p><div class="tools"><input id="q" type="search" placeholder="Buscar trial, revista, autor o tema…" aria-label="Buscar en biblioteca"><select id="area" aria-label="Filtrar por área"><option value="">Todas las áreas</option><option>Medicina Crítica</option><option>Medicina Interna</option></select></div><div id="list"><div class="empty">Cargando tu biblioteca…</div></div><div id="status" class="status" aria-live="polite"></div></main><script type="module">
import './client-monitor.js';
import{getLibraryState,toggleFavorite,markRead}from'./library-store.js';
const list=document.getElementById('list'),q=document.getElementById('q'),area=document.getElementById('area'),status=document.getElementById('status');
let all=[],state;
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const specialty=r=>r.especialidad_principal||r.especialidad||'Evidencia clínica';
const topics=r=>Array.isArray(r.temas)?r.temas:(r.tema?[r.tema]:[]);
function render(){
  const term=q.value.trim().toLowerCase(),a=area.value,fav=new Set(state.favorites);
  const rows=all.filter(r=>fav.has(String(r.id)))
    .filter(r=>!a||specialty(r)===a)
    .filter(r=>!term||[r.titulo,r.nombre,r.revista,r.autor,...topics(r),r.objetivo].join(' ').toLowerCase().includes(term));
  if(!rows.length){list.innerHTML='<div class="empty">No hay resúmenes guardados que coincidan. Desde la portada puedes usar “Guardar” para añadirlos aquí.</div>';return}
  list.innerHTML=rows.map(r=>`<article class="item"><div><div class="badges"><span class="badge">${esc(specialty(r))}</span>${topics(r)[0]?`<span class="badge">${esc(topics(r)[0])}</span>`:''}</div><h2><a data-read="${r.id}" href="resumen.html?id=${encodeURIComponent(r.id)}">${esc(r.titulo||r.nombre||'Resumen')}</a></h2><div class="meta">${esc(r.autor||'')} · ${esc(r.revista||'')}${r.fecha?' · '+esc(r.fecha):''}</div></div><button class="btn" data-remove="${r.id}">Quitar de biblioteca</button></article>`).join('');
  list.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await toggleFavorite(b.dataset.remove);state.favorites=state.favorites.filter(x=>x!==String(b.dataset.remove));render();status.textContent='Biblioteca actualizada.'}catch(e){status.textContent=e?.message||'No fue posible actualizar la biblioteca.'}finally{b.disabled=false}});
  list.querySelectorAll('[data-read]').forEach(a=>a.addEventListener('click',()=>markRead(a.dataset.read).catch(()=>{}),{capture:true}))
}
try{
  state=await getLibraryState();
  if(state.mfaRequired)location.replace('login.html?mfa=1&next=biblioteca.html');
  else if(!state.signedIn)location.replace('login.html');
  else{
    const r=await fetch('resumenes.json',{cache:'no-store'});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    all=(await r.json()).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
    render();q.oninput=render;area.onchange=render
  }
}catch(e){console.error(e);list.innerHTML='<div class="empty">No pudimos cargar tu biblioteca. Recarga la página.</div>'}
</script><script src="/future-experience.js?v=1" defer></script><script src="/future-experience-final.js?v=3" defer></script><script src="/future-experience-fix-v4.js?v=1" defer></script><script src="/future-experience-fix-v4-compat.js?v=1" defer></script><script src="/legacy-unifier-v4.js?v=1" defer></script><script src="/global-search.js?v=1" defer></script><script src="/reader-endmatter-v7.js?v=1" defer></script></body></html>
