<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex,follow"><title>Mi biblioteca · Resúmenes Trials</title><link rel="icon" href="favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
:root{--t:#12233b;--t2:#38506e;--teal:#1c8a8a;--teal2:#0f5f5f;--paper:#f7f6f2;--paper2:#efece4;--line:#ddd8cc;--amber:#c8892a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--t);font:18px/1.55 'Newsreader',Georgia,serif}.page{max-width:1200px;margin:auto;padding:26px 34px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:42px}.brand img{height:58px}.top a{color:var(--teal2);text-decoration:none}.eyebrow,label{font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--t2)}h1{font:500 clamp(44px,7vw,72px)/1 'Fraunces',serif;margin:8px 0 12px}.lead{color:var(--t2);max-width:760px;font-size:20px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:32px 0 24px}.tools input,.tools select{border:1px solid var(--line);border-radius:7px;background:#fff;padding:11px 13px;font:16px 'Newsreader',serif;color:var(--t)}.tools input{flex:1;min-width:240px}.empty{padding:40px 0;color:var(--t2)}.item{border-top:1px solid var(--line);padding:24px 0;display:grid;grid-template-columns:1fr auto;gap:20px}.item h2{font:500 28px/1.15 'Fraunces',serif;margin:0 0 8px}.item h2 a{color:inherit;text-decoration:none}.meta{font:12px 'IBM Plex Mono',monospace;color:var(--t2)}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.badge{font:10px 'IBM Plex Mono',monospace;border:1px solid var(--line);border-radius:3px;padding:3px 7px}.btn{border:1px solid var(--teal2);border-radius:999px;background:#fff;color:var(--teal2);padding:8px 13px;font:500 11px 'IBM Plex Mono',monospace;cursor:pointer}.btn:hover{background:var(--teal2);color:#fff}.status{margin-top:18px;color:var(--t2);font:12px 'IBM Plex Mono',monospace}@media(max-width:650px){.page{padding:18px 18px 50px}.brand img{height:44px}.item{grid-template-columns:1fr}.btn{width:100%}}
</style></head><body><main class="page"><div class="top"><a class="brand" href="index.html"><img src="logo.png" alt="Resúmenes Trials"></a><a href="cuenta.html">Mi cuenta</a></div><div class="eyebrow">Cuenta personal</div><h1>Mi biblioteca</h1><p class="lead">Tus resúmenes guardados, reunidos en un solo lugar para volver a la evidencia que decidiste conservar.</p><div class="tools"><input id="q" type="search" placeholder="Buscar en tus guardados…" aria-label="Buscar en biblioteca"><select id="area" aria-label="Filtrar por área"><option value="">Todas las áreas</option><option>Medicina Crítica</option><option>Medicina Interna</option></select></div><div id="list"><div class="empty">Cargando tu biblioteca…</div></div><div id="status" class="status"></div></main><script type="module">
import './client-monitor.js';import{getLibraryState,toggleFavorite,markRead}from'./library-store.js';
const list=document.getElementById('list'),q=document.getElementById('q'),area=document.getElementById('area'),status=document.getElementById('status');let all=[],state;
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function render(){const term=q.value.trim().toLowerCase(),a=area.value;const fav=new Set(state.favorites);const rows=all.filter(r=>fav.has(String(r.id))).filter(r=>!a||r.especialidad===a).filter(r=>!term||[r.titulo,r.nombre,r.revista,r.autor,r.tema,r.objetivo].join(' ').toLowerCase().includes(term));if(!rows.length){list.innerHTML='<div class="empty">No hay resúmenes guardados que coincidan. Desde la portada puedes usar “Guardar” para añadirlos aquí.</div>';return}list.innerHTML=rows.map(r=>`<article class="item"><div><div class="badges"><span class="badge">${esc(r.especialidad||'Evidencia clínica')}</span>${r.tema?`<span class="badge">${esc(r.tema)}</span>`:''}</div><h2><a data-read="${r.id}" href="resumen.html?id=${encodeURIComponent(r.id)}">${esc(r.titulo||r.nombre||'Resumen')}</a></h2><div class="meta">${esc(r.autor||'')} · ${esc(r.revista||'')}${r.fecha?' · '+esc(r.fecha):''}</div></div><button class="btn" data-remove="${r.id}">Quitar</button></article>`).join('');list.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await toggleFavorite(b.dataset.remove);state.favorites=state.favorites.filter(x=>x!==String(b.dataset.remove));render();status.textContent='Biblioteca actualizada.'}catch(e){status.textContent='No fue posible actualizar la biblioteca.'}});list.querySelectorAll('[data-read]').forEach(a=>a.addEventListener('click',()=>markRead(a.dataset.read).catch(()=>{}),{capture:true}))}
try{state=await getLibraryState();if(!state.signedIn){location.replace('login.html');}else{const r=await fetch('resumenes.json',{cache:'no-store'});all=(await r.json()).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));render();q.oninput=render;area.onchange=render}}catch(e){console.error(e);list.innerHTML='<div class="empty">No pudimos cargar tu biblioteca. Recarga la página.</div>'}
</script></body></html>
